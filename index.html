  app.querySelectorAll('[data-add-ex]').forEach(el=>el.addEventListener('click', ()=>{ const name = el.getAttribute('data-add-ex'); state.draft.exercises.push({name, sets:[blankSet(state.draft.dayType, name)]}); render(); }));
  app.querySelectorAll('[data-add-custom-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const input = app.querySelector('[data-custom-ex-input]'); const name = input ? input.value.trim() : ''; if(!name) return;
    const dayKey = state.draft.dayType; const pool = loadCustomPool(); if(!pool[dayKey]) pool[dayKey] = [];
    const builtinPool = BUILTIN_DAY_TYPES[dayKey] ? BUILTIN_DAY_TYPES[dayKey].pool : [];
    if(!builtinPool.includes(name) && !pool[dayKey].includes(name)){ pool[dayKey].push(name); saveCustomPool(pool); }
    state.draft.exercises.push({name, sets:[blankSet(dayKey, name)]}); render();
  }));
  app.querySelectorAll('[data-toggle-pool-edit]').forEach(el=>el.addEventListener('click', ()=>{ state.poolEditMode = !state.poolEditMode; state.editPoolName = null; state.editPoolValue = ''; render(); }));
  app.querySelectorAll('[data-pool-edit]').forEach(el=>el.addEventListener('click', ()=>{ state.editPoolName = el.getAttribute('data-pool-edit'); state.editPoolValue = state.editPoolName; render(); }));
  app.querySelectorAll('[data-pool-edit-input]').forEach(el=>el.addEventListener('input', ()=>{ state.editPoolValue = el.value; }));
  app.querySelectorAll('[data-pool-edit-save]').forEach(el=>el.addEventListener('click', ()=>{ const oldName = el.getAttribute('data-pool-edit-save'); renameExercise(state.draft.dayType, oldName, state.editPoolValue); state.editPoolName = null; state.editPoolValue = ''; render(); }));
  app.querySelectorAll('[data-pool-edit-cancel]').forEach(el=>el.addEventListener('click', ()=>{ state.editPoolName = null; state.editPoolValue = ''; render(); }));
  app.querySelectorAll('[data-pool-perarm]').forEach(el=>el.addEventListener('click', ()=>{ togglePerArm(state.draft.dayType, el.getAttribute('data-pool-perarm')); render(); }));
  app.querySelectorAll('[data-pool-delete]').forEach(el=>el.addEventListener('click', ()=>{ deleteExercise(state.draft.dayType, el.getAttribute('data-pool-delete')); render(); }));
  app.querySelectorAll('[data-remove-ex]').forEach(el=>el.addEventListener('click', ()=>{ const name = el.getAttribute('data-remove-ex'); state.draft.exercises = state.draft.exercises.filter(e=>e.name!==name); render(); }));
  app.querySelectorAll('[data-add-set]').forEach(el=>el.addEventListener('click', ()=>{ const name = el.getAttribute('data-add-set'); const ex = state.draft.exercises.find(e=>e.name===name); const lastWeight = ex.sets.length ? ex.sets[ex.sets.length-1].weight : ''; ex.sets.push({...blankSet(state.draft.dayType, name), weight:lastWeight}); render(); }));
  app.querySelectorAll('[data-remove-set]').forEach(el=>el.addEventListener('click', ()=>{ const name = el.getAttribute('data-remove-set'); const idx = +el.getAttribute('data-idx'); const ex = state.draft.exercises.find(e=>e.name===name); ex.sets.splice(idx,1); render(); }));
  app.querySelectorAll('.set-input[data-ex]').forEach(el=>el.addEventListener('input', ()=>{
    const name = el.getAttribute('data-ex'); const idx = +el.getAttribute('data-idx'); const field = el.getAttribute('data-field');
    const ex = state.draft.exercises.find(e=>e.name===name);
    if(ex && ex.sets[idx]) ex.sets[idx][field] = el.value;
    persistDraft(); updateScorePreview(); refreshWeightSuggestFor(name);
  }));
  app.querySelectorAll('[data-move-up]').forEach(el=>el.addEventListener('click', ()=>{ const i = +el.getAttribute('data-move-up'); if(i > 0){ const arr = state.draft.exercises; [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; persistDraft(); render(); } }));
  app.querySelectorAll('[data-move-down]').forEach(el=>el.addEventListener('click', ()=>{ const i = +el.getAttribute('data-move-down'); const arr = state.draft.exercises; if(i < arr.length-1){ [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; persistDraft(); render(); } }));
  app.querySelectorAll('[data-finish]').forEach(el=>el.addEventListener('click', ()=>{
    if(state.draft && state.draft.exercises.length>0){ state.sessions = [state.draft, ...state.sessions]; saveSessions(state.sessions); showToast('SESSION GESPEICHERT'); }
    state.draft=null; state.view='home'; render();
  }));
  app.querySelectorAll('[data-editday-name]').forEach(el=>el.addEventListener('input', ()=>{ state.editDay.name = el.value; const btn = app.querySelector('[data-editday-save]'); if(btn) btn.disabled = !el.value.trim(); }));
  app.querySelectorAll('[data-editday-short]').forEach(el=>el.addEventListener('input', ()=>{ state.editDay.short = el.value; }));
  app.querySelectorAll('[data-editday-color]').forEach(el=>el.addEventListener('click', ()=>{ state.editDay.accent = el.getAttribute('data-editday-color'); render(); }));
  app.querySelectorAll('[data-editday-save]').forEach(el=>el.addEventListener('click', ()=>{ const name = state.editDay.name.trim(); if(!name) return; const short = (state.editDay.short.trim() || autoShort(name)).toUpperCase(); upsertCustomDay(state.editDay.key, {label:name.toUpperCase(), short, accent:state.editDay.accent}); state.editDay = null; state.view='home'; render(); }));
  app.querySelectorAll('[data-editday-delete]').forEach(el=>el.addEventListener('click', ()=>{ const key = state.editDay.key; askConfirm({ title:'Tag löschen', message:'Diesen Tag wirklich löschen?', confirmLabel:'LÖSCHEN', cancelLabel:'BEHALTEN', danger:true, onConfirm:()=>{ saveCustomDays(loadCustomDays().filter(d=>d.key!==key)); state.editDay = null; state.view='home'; } }); }));
  app.querySelectorAll('[data-newday-open]').forEach(el=>el.addEventListener('click', ()=>{ state.newDay = {name:'', short:'', shortTouched:false, accent:DAY_SWATCHES[0]}; state.view='newday'; render(); }));
  app.querySelectorAll('[data-editmode-open]').forEach(el=>el.addEventListener('click', ()=>{ showDayPicker(); }));
  app.querySelectorAll('[data-newday-name]').forEach(el=>el.addEventListener('input', ()=>{ state.newDay.name = el.value; if(!state.newDay.shortTouched){ state.newDay.short = autoShort(el.value); const si = app.querySelector('[data-newday-short]'); if(si) si.value = state.newDay.short; } const btn = app.querySelector('[data-newday-create]'); if(btn) btn.disabled = !el.value.trim(); }));
  app.querySelectorAll('[data-newday-short]').forEach(el=>el.addEventListener('input', ()=>{ state.newDay.shortTouched = true; state.newDay.short = el.value; }));
  app.querySelectorAll('[data-newday-color]').forEach(el=>el.addEventListener('click', ()=>{ state.newDay.accent = el.getAttribute('data-newday-color'); render(); }));
  app.querySelectorAll('[data-newday-create]').forEach(el=>el.addEventListener('click', ()=>{ const name = state.newDay.name.trim(); if(!name) return; const key = 'C' + uid(); const short = (state.newDay.short.trim() || autoShort(name)).toUpperCase(); const days = loadCustomDays(); days.push({key, label:name.toUpperCase(), short, accent:state.newDay.accent}); saveCustomDays(days); state.view='home'; render(); }));
  app.querySelectorAll('[data-goto-auth]').forEach(el=>el.addEventListener('click', ()=>{ state.authForm = {email:'',password:'',error:''}; state.view='auth'; render(); }));
  app.querySelectorAll('[data-auth-email]').forEach(el=>el.addEventListener('input', ()=>{ state.authForm.email = el.value; }));
  app.querySelectorAll('[data-auth-password]').forEach(el=>el.addEventListener('input', ()=>{ state.authForm.password = el.value; }));
  app.querySelectorAll('[data-auth-login]').forEach(el=>el.addEventListener('click', ()=>{ if(!fbEnabled){ state.authForm.error = 'Sync ist noch nicht eingerichtet.'; render(); return; } const {email, password} = state.authForm; signInPersistent(email, password).then(()=>{ state.authForm.error=''; state.view='home'; render(); }).catch(err=>{ state.authForm.error = fbErrorMsg(err); render(); }); }));
  app.querySelectorAll('[data-auth-register]').forEach(el=>el.addEventListener('click', ()=>{ if(!fbEnabled){ state.authForm.error = 'Sync ist noch nicht eingerichtet.'; render(); return; } const {email, password} = state.authForm; registerPersistent(email, password).then(()=>{ state.authForm.error=''; state.view='home'; render(); }).catch(err=>{ state.authForm.error = fbErrorMsg(err); render(); }); }));
  app.querySelectorAll('[data-auth-google]').forEach(el=>el.addEventListener('click', ()=> oauthSignIn('google')));
  app.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click', ()=>{ if(fbAuth) fbAuth.signOut(); detachCloudSync(); authUser = null; state.view = 'auth'; render(); }));
  app.querySelectorAll('[data-goto-profile]').forEach(el=>el.addEventListener('click', ()=>{ state.view='profile'; render(); }));
  app.querySelectorAll('[data-profile-height]').forEach(el=>el.addEventListener('input', ()=>{ state.profile.height = el.value; }));
  app.querySelectorAll('[data-profile-weight]').forEach(el=>el.addEventListener('input', ()=>{ state.profile.weight = el.value; }));
  app.querySelectorAll('[data-profile-birthdate]').forEach(el=>el.addEventListener('input', ()=>{ state.profile.birthDate = el.value; }));
  app.querySelectorAll('[data-profile-gender]').forEach(el=>el.addEventListener('click', ()=>{ state.profile.gender = el.getAttribute('data-profile-gender'); render(); }));
  app.querySelectorAll('[data-profile-exp]').forEach(el=>el.addEventListener('click', ()=>{ state.profile.experience = el.getAttribute('data-profile-exp'); render(); }));
  app.querySelectorAll('[data-profile-save]').forEach(el=>el.addEventListener('click', ()=>{ saveProfile(state.profile); showToast('✓ PROFIL GESPEICHERT'); render(); }));
  app.querySelectorAll('[data-chart-point]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); showSessionPopup(el.getAttribute('data-chart-point')); }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ state.detailId = el.getAttribute('data-open'); state.confirmDelete=false; state.view='detail'; render(); }));
  app.querySelectorAll('[data-ask-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=true; render(); }));
  app.querySelectorAll('[data-edit-session-open]').forEach(el=>el.addEventListener('click', ()=>{ const s = state.sessions.find(x=>x.id===state.detailId); if(s) state.editSessionDraft = JSON.parse(JSON.stringify(s)); render(); }));
  app.querySelectorAll('[data-edit-cancel]').forEach(el=>el.addEventListener('click', ()=>{ state.editSessionDraft = null; render(); }));
  app.querySelectorAll('[data-edit-remove-ex]').forEach(el=>el.addEventListener('click', ()=>{ const i = +el.getAttribute('data-edit-remove-ex'); state.editSessionDraft.exercises.splice(i,1); render(); }));
  app.querySelectorAll('[data-edit-add-set]').forEach(el=>el.addEventListener('click', ()=>{ const i = +el.getAttribute('data-edit-add-set'); const ex = state.editSessionDraft.exercises[i]; const last = ex.sets[ex.sets.length-1] || {}; const newSet = {weight: last.weight||'', reps:''}; if(last.repsLeft!==undefined || last.repsRight!==undefined){ newSet.repsLeft=''; newSet.repsRight=''; delete newSet.reps; } ex.sets.push(newSet); render(); }));
  app.querySelectorAll('[data-edit-remove-set]').forEach(el=>el.addEventListener('click', ()=>{ const i = +el.getAttribute('data-edit-remove-set'); const si = +el.getAttribute('data-edit-set-idx'); state.editSessionDraft.exercises[i].sets.splice(si,1); render(); }));
  app.querySelectorAll('.set-input[data-edit-ex]').forEach(el=>el.addEventListener('input', ()=>{ const i = +el.getAttribute('data-edit-ex'); const si = +el.getAttribute('data-edit-idx'); const field = el.getAttribute('data-edit-field'); state.editSessionDraft.exercises[i].sets[si][field] = el.value; }));
  app.querySelectorAll('[data-edit-save]').forEach(el=>el.addEventListener('click', ()=>{ const idx = state.sessions.findIndex(x=>x.id===state.editSessionDraft.id); if(idx>=0){ state.sessions[idx] = state.editSessionDraft; saveSessions(state.sessions); } state.editSessionDraft = null; showToast('SESSION AKTUALISIERT'); render(); }));
  app.querySelectorAll('[data-cancel-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=false; render(); }));
  app.querySelectorAll('[data-confirm-delete]').forEach(el=>el.addEventListener('click', ()=>{ const id = el.getAttribute('data-confirm-delete'); state.sessions = state.sessions.filter(s=>s.id!==id); saveSessions(state.sessions); state.confirmDelete=false; state.detailId=null; state.view='history'; render(); }));
}
restoreDraft();
render();
if(fbEnabled){
  fbAuth.getRedirectResult().catch(err=>{ state.authForm.error = fbErrorMsg(err); });
  fbAuth.onAuthStateChanged(user=>{
    authChecked = true;
    authUser = user ? {uid:user.uid, email:user.email} : null;
    detachCloudSync();
    if(user) attachCloudSync(user.uid);
    render();
  });
} else { authChecked = true; }
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
