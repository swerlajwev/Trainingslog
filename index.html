<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trainingslog</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trainingslog" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000000; --surface:#18181b; --border:#27272a; --border-hover:#52525b;
    --text:#f4f4f5; --text-dim:#a1a1aa; --text-mute:#71717a; --text-faint:#3f3f46;
    --lime:#a3e635; --pink:#ec4899; --sky:#38bdf8;
    --font-display:'Oswald',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
       -webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;padding:2rem 1rem 3rem;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .mono{font-family:var(--font-mono);}
  .display{font-family:var(--font-display);}
  .eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--text-mute);}
  .h1{font-size:1.6rem;font-weight:600;letter-spacing:.02em;margin:.2rem 0 1.2rem;}
  .frame{position:relative;background:rgba(24,24,27,.6);border:1px solid var(--border);padding:1rem;width:100%;text-align:left;color:inherit;}
  .frame .corner{position:absolute;width:12px;height:12px;}
  .frame .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);}
  .frame .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
  .day-card{margin-bottom:.75rem;background:#000;border:none;padding:0;}
  .day-card .frame{padding:1rem;}
  .day-row{display:flex;align-items:center;justify-content:space-between;}
  .day-badge{display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.8rem;letter-spacing:.2em;}
  .btn-outline:hover{border-color:var(--border-hover);color:var(--text);}
  .chip-row{display:flex;gap:.5rem;margin-bottom:1.5rem;}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem;border:1px solid var(--border);background:transparent;color:var(--text-mute);font-size:.72rem;letter-spacing:.2em;}
  .chip.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .set-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
  .set-idx{width:1.2rem;text-align:center;font-size:.72rem;color:var(--accent);}
  .set-input{width:100%;background:#09090b;border:1px solid var(--border);padding:.4rem .5rem;color:var(--text);font-size:.9rem;}
  .set-input:focus{outline:none;border-color:var(--border-hover);}
  .x-btn{background:none;border:none;color:var(--text-faint);padding:.2rem;}
  .add-set{margin-top:.5rem;display:flex;align-items:center;gap:.3rem;background:none;border:none;font-size:.72rem;letter-spacing:.2em;color:var(--accent);padding:0;}
  .pool-wrap{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem;}
  .pool-btn{display:flex;align-items:center;gap:.3rem;padding:.55rem .8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.85rem;}
  .pool-btn:hover{border-color:var(--border-hover);color:var(--text);}
  .back{display:flex;align-items:center;gap:.25rem;background:none;border:none;color:var(--text-mute);font-size:.9rem;margin-bottom:1.2rem;padding:0;}
  .save-btn{width:100%;padding:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;letter-spacing:.15em;color:#000;border:none;background:var(--accent);font-family:var(--font-display);font-size:1rem;}
  .save-btn:disabled{background:var(--border);color:var(--text-faint);}
  .ex-card{margin-bottom:.75rem;}
  .ex-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:.75rem;}
  .ex-title{font-weight:500;}
  .hist-row{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);padding:.7rem 1rem;background:none;color:inherit;margin-bottom:.5rem;}
  .hist-row:hover{border-color:var(--border-hover);}
  .hist-left{display:flex;align-items:center;gap:.75rem;}
  .hist-date{width:2.5rem;text-align:center;}
  .hist-wd{font-size:.62rem;color:var(--text-mute);}
  .hist-d{font-size:.85rem;}
  .tag{font-size:.72rem;letter-spacing:.2em;}
  .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .6rem;font-size:.72rem;border:1px solid;margin-right:.5rem;}
  .set-pill{padding:.25rem .5rem;background:#09090b;border:1px solid var(--border);font-size:.85rem;margin:0 .4rem .4rem 0;display:inline-block;}
  .del-confirm{display:flex;gap:.5rem;}
  .del-confirm button{flex:1;padding:.8rem;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:.85rem;letter-spacing:.15em;}
  .del-confirm .yes{background:var(--pink);color:#000;border:none;font-weight:600;}
  .empty{color:var(--text-faint);font-size:.85rem;font-family:var(--font-mono);}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
  .stat-num{font-size:1.6rem;color:var(--lime);text-align:right;}
  .stat-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--text-mute);text-align:right;}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  .pulse{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// Icons (minimal inline SVG, no external deps)
// ---------------------------------------------------------------------
const ICON = {
  dumbbell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 11 11M13 13l4.5 4.5M4.5 4.5l1-1a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3l-1 1a2 2 0 0 1-3 0l-1-1a2 2 0 0 1 0-3ZM14.5 14.5l1-1a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3l-1 1a2 2 0 0 1-3 0l-1-1a2 2 0 0 1 0-3Z"/></svg>',
  history:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  chevronLeft:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  zap:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>',
  flame:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg>',
};

// ---------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------
const DAY_TYPES = {
  BR: { key:'BR', label:'BRUST / RÜCKEN', short:'B/R', accent:'var(--pink)',
    pool:['Bankdrücken','High-to-Low Latziehen','Schrägbankdrücken','T-Bar Row','Untere Brust / Kabel-Flys','Breiter Latzug','Klimmzüge','Enges Rudern','Seitheben','Hintere Schultern'] },
  AS: { key:'AS', label:'ARME / SCHULTERN', short:'A/S', accent:'var(--sky)',
    pool:['Schulterpresse','Seitheben','Bizepscurls','Trizeps Push-Down','Hammercurls (einarmig)','Trizeps überkopf','Unterarme','Hintere Schultern'] },
};
const uid = () => Math.random().toString(36).slice(2,10);
const fmtDate = iso => new Date(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtWd = iso => new Date(iso).toLocaleDateString('de-DE',{weekday:'short'}).toUpperCase();

// ---------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------
const STORE_KEY = 'trainingslog_sessions';
function loadSessions(){
  try{ const raw = localStorage.getItem(STORE_KEY); const parsed = raw ? JSON.parse(raw) : []; return Array.isArray(parsed)?parsed:[]; }
  catch(e){ return []; }
}
function saveSessions(sessions){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); }catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------
let state = {
  view: 'home',
  sessions: loadSessions(),
  draft: null,
  detailId: null,
  confirmDelete: false,
};

const app = document.getElementById('app');

function render(){
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='session') app.innerHTML = renderSession();
  else if(state.view==='history') app.innerHTML = renderHistory();
  else if(state.view==='detail') app.innerHTML = renderDetail();
  attachListeners();
}

// ---------------------------------------------------------------------
// Home
// ---------------------------------------------------------------------
function renderHome(){
  const now = new Date();
  const weekCount = state.sessions.filter(s => (now - new Date(s.date))/86400000 < 7).length;
  const lastByDay = key => state.sessions.find(s => s.dayType===key);

  const cards = Object.values(DAY_TYPES).map(day => {
    const last = lastByDay(day.key);
    return `
    <div class="day-card">
      <button class="frame" style="--accent:${day.accent}" data-start="${day.key}">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="day-row">
          <div>
            <div class="eyebrow mono" style="color:${day.accent}">TAG · ${day.short}</div>
            <div class="display" style="font-size:1.3rem;font-weight:600;margin-top:.2rem;">${day.label}</div>
            <div class="mono" style="font-size:.75rem;color:var(--text-mute);margin-top:.3rem;">${last?('ZULETZT: '+fmtDate(last.date)):'NOCH KEINE DATEN'}</div>
          </div>
          <div class="day-badge" style="--accent:${day.accent}">${ICON.dumbbell.replace('currentColor', day.accent)}</div>
        </div>
      </button>
    </div>`;
  }).join('');

  return `
    <div class="stat-top">
      <div>
        <div class="eyebrow mono">TRAININGSLOG</div>
        <div class="h1 display" style="margin-bottom:0;">STATUS</div>
      </div>
      <div>
        <div class="stat-num mono">${String(weekCount).padStart(2,'0')}<span style="color:var(--text-faint)">/03</span></div>
        <div class="stat-lbl">DIESE WOCHE</div>
      </div>
    </div>
    <div class="eyebrow mono" style="margin-bottom:.75rem;">SESSION WÄHLEN</div>
    ${cards}
    <button class="btn-outline mono" style="margin-top:1.5rem;" data-history="1">${ICON.history} VERLAUF (${state.sessions.length})</button>
  `;
}

// ---------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------
function renderSession(){
  const d = state.draft;
  const day = DAY_TYPES[d.dayType];
  const active = d.exercises.map(e=>e.name);

  const toggles = `
    <div class="chip-row">
      <button class="chip ${d.preWorkout?'active':''}" style="--accent:var(--lime)" data-toggle="preWorkout">${ICON.zap} PRE-WORKOUT</button>
      <button class="chip ${d.energy?'active':''}" style="--accent:var(--pink)" data-toggle="energy">${ICON.flame} ENERGY</button>
    </div>`;

  const exCards = d.exercises.map(ex => `
    <div class="ex-card frame" style="--accent:${day.accent}">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="ex-head">
        <div class="ex-title">${ex.name}</div>
        <button class="x-btn" data-remove-ex="${ex.name}">${ICON.trash}</button>
      </div>
      <div data-sets-for="${ex.name}">
        ${ex.sets.map((s,idx)=>`
          <div class="set-row">
            <span class="set-idx mono" style="color:${day.accent}">${idx+1}</span>
            <input class="set-input mono" type="number" inputmode="decimal" placeholder="kg" value="${s.weight}" data-ex="${ex.name}" data-idx="${idx}" data-field="weight" />
            <span style="color:var(--text-faint);font-size:.8rem;">×</span>
            <input class="set-input mono" type="number" inputmode="numeric" placeholder="wdh" value="${s.reps}" data-ex="${ex.name}" data-idx="${idx}" data-field="reps" />
            ${ex.sets.length>1?`<button class="x-btn" data-remove-set="${ex.name}" data-idx="${idx}">${ICON.x}</button>`:''}
          </div>`).join('')}
      </div>
      <button class="add-set mono" data-add-set="${ex.name}">${ICON.plus} SATZ</button>
    </div>
  `).join('');

  const pool = day.pool.filter(n=>!active.includes(n)).map(n=>`
    <button class="pool-btn" data-add-ex="${n}">${ICON.plus} ${n}</button>
  `).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;">
      <button class="back" data-discard="1">${ICON.chevronLeft} Abbrechen</button>
      <div class="mono" style="display:flex;align-items:center;gap:.4rem;font-size:.72rem;letter-spacing:.2em;color:${day.accent}"><span class="pulse" style="color:${day.accent}"></span>AKTIV</div>
    </div>
    <div class="eyebrow mono" style="color:${day.accent}">TAG · ${day.short}</div>
    <div class="h1 display">${day.label}</div>
    ${toggles}
    <div>${exCards}</div>
    <div class="eyebrow mono" style="margin:1.5rem 0 .75rem;">ÜBUNG HINZUFÜGEN</div>
    <div class="pool-wrap">${pool}</div>
    <button class="save-btn" data-finish="1" ${d.exercises.length===0?'disabled':''} style="background:${day.accent}">${ICON.check} SESSION SPEICHERN</button>
  `;
}

// ---------------------------------------------------------------------
// History
// ---------------------------------------------------------------------
function renderHistory(){
  const rows = state.sessions.map(s=>{
    const day = DAY_TYPES[s.dayType];
    return `
    <button class="hist-row" data-open="${s.id}">
      <div class="hist-left">
        <div class="hist-date">
          <div class="hist-wd mono">${fmtWd(s.date)}</div>
          <div class="hist-d mono">${fmtDate(s.date)}</div>
        </div>
        <div>
          <div class="tag mono" style="color:${day.accent}">${day.short}</div>
          <div style="font-size:.9rem;color:var(--text-dim);">${s.exercises.length} Übungen</div>
        </div>
      </div>
      <div style="display:flex;gap:.4rem;color:var(--lime);">
        ${s.preWorkout?ICON.zap.replace('currentColor','var(--lime)'):''}
        ${s.energy?ICON.flame.replace('currentColor','var(--pink)'):''}
      </div>
    </button>`;
  }).join('');

  return `
    <button class="back" data-back="home">${ICON.chevronLeft} Zurück</button>
    <div class="h1 display">VERLAUF</div>
    ${state.sessions.length===0?'<div class="empty">NOCH KEINE SESSIONS GESPEICHERT</div>':rows}
  `;
}

// ---------------------------------------------------------------------
// Detail
// ---------------------------------------------------------------------
function renderDetail(){
  const s = state.sessions.find(x=>x.id===state.detailId);
  if(!s) return `<button class="back" data-back="history">${ICON.chevronLeft} Zurück</button><div class="empty">Session nicht gefunden.</div>`;
  const day = DAY_TYPES[s.dayType];

  const badges = `
    ${s.preWorkout?`<span class="badge mono" style="border-color:var(--lime);color:var(--lime)">${ICON.zap} PRE-WORKOUT</span>`:''}
    ${s.energy?`<span class="badge mono" style="border-color:var(--pink);color:var(--pink)">${ICON.flame} ENERGY</span>`:''}
  `;

  const exList = s.exercises.map(ex=>`
    <div class="frame" style="--accent:${day.accent};margin-bottom:.75rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="ex-title" style="margin-bottom:.5rem;">${ex.name}</div>
      <div>${ex.sets.map(st=>`<span class="set-pill mono">${st.weight||'–'}kg × ${st.reps||'–'}</span>`).join('')}</div>
    </div>
  `).join('');

  return `
    <button class="back" data-back="history">${ICON.chevronLeft} Zurück</button>
    <div class="eyebrow mono" style="color:${day.accent}">${fmtWd(s.date)} · ${fmtDate(s.date)}</div>
    <div class="h1 display">${day.label}</div>
    <div style="margin-bottom:1.5rem;">${badges}</div>
    ${exList}
    <div style="margin-top:1.5rem;">
      ${state.confirmDelete ? `
        <div class="del-confirm">
          <button data-cancel-delete="1">ABBRECHEN</button>
          <button class="yes mono" data-confirm-delete="${s.id}">LÖSCHEN</button>
        </div>` : `
        <button class="btn-outline mono" data-ask-delete="1">${ICON.trash} SESSION LÖSCHEN</button>`}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------
function attachListeners(){
  app.querySelectorAll('[data-start]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.getAttribute('data-start');
    state.draft = { id:uid(), date:new Date().toISOString(), dayType:key, preWorkout:false, energy:false, exercises:[] };
    state.view='session'; render();
  }));

  app.querySelectorAll('[data-history]').forEach(el=>el.addEventListener('click', ()=>{ state.view='history'; render(); }));
  app.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click', ()=>{ state.view=el.getAttribute('data-back'); state.confirmDelete=false; render(); }));

  app.querySelectorAll('[data-discard]').forEach(el=>el.addEventListener('click', ()=>{ state.draft=null; state.view='home'; render(); }));

  app.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const f = el.getAttribute('data-toggle'); state.draft[f] = !state.draft[f]; render();
  }));

  app.querySelectorAll('[data-add-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-add-ex');
    state.draft.exercises.push({ name, sets:[{weight:'',reps:''}] }); render();
  }));
  app.querySelectorAll('[data-remove-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-remove-ex');
    state.draft.exercises = state.draft.exercises.filter(e=>e.name!==name); render();
  }));
  app.querySelectorAll('[data-add-set]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-add-set');
    const ex = state.draft.exercises.find(e=>e.name===name);
    ex.sets.push({weight:'',reps:''}); render();
  }));
  app.querySelectorAll('[data-remove-set]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-remove-set'); const idx = +el.getAttribute('data-idx');
    const ex = state.draft.exercises.find(e=>e.name===name);
    ex.sets.splice(idx,1); render();
  }));
  // inputs: update state only, no re-render (keeps focus/cursor intact)
  app.querySelectorAll('.set-input').forEach(el=>el.addEventListener('input', ()=>{
    const name = el.getAttribute('data-ex'); const idx = +el.getAttribute('data-idx'); const field = el.getAttribute('data-field');
    const ex = state.draft.exercises.find(e=>e.name===name);
    ex.sets[idx][field] = el.value;
  }));

  app.querySelectorAll('[data-finish]').forEach(el=>el.addEventListener('click', ()=>{
    if(state.draft && state.draft.exercises.length>0){
      state.sessions = [state.draft, ...state.sessions];
      saveSessions(state.sessions);
    }
    state.draft=null; state.view='home'; render();
  }));

  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{
    state.detailId = el.getAttribute('data-open'); state.confirmDelete=false; state.view='detail'; render();
  }));
  app.querySelectorAll('[data-ask-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=true; render(); }));
  app.querySelectorAll('[data-cancel-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=false; render(); }));
  app.querySelectorAll('[data-confirm-delete]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-confirm-delete');
    state.sessions = state.sessions.filter(s=>s.id!==id);
    saveSessions(state.sessions);
    state.confirmDelete=false; state.detailId=null; state.view='history'; render();
  }));
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
