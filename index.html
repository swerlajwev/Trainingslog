<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trainingslog</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trainingslog" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#000000; --surface:#18181b; --border:#27272a; --border-hover:#52525b;
    --text:#f4f4f5; --text-dim:#a1a1aa; --text-mute:#71717a; --text-faint:#3f3f46;
    --lime:#a3e635; --pink:#ec4899; --sky:#38bdf8;
    --orange:#fb923c; --green:#4ade80; --blue:#60a5fa; --red:#ef4444; --gold:#fbbf24; --yellow:#facc15; --purple:#a78bfa; --teal:#2dd4bf;
    --font-display:'Oswald',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;padding:2rem 1rem 7rem;min-height:100vh;}
  .day-grid{display:flex;flex-direction:column;gap:.75rem;}
  @media (min-width:860px){#app{max-width:920px;padding-top:3rem;}.day-grid{flex-direction:row;flex-wrap:wrap;gap:1rem;}.day-grid .day-card{flex:1 1 calc(50% - .5rem);margin-bottom:0;}.pool-wrap{gap:.6rem;}.mood-row{gap:.5rem;}}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .mono{font-family:var(--font-mono);}
  .display{font-family:var(--font-display);}
  .eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--text-mute);}
  .h1{font-size:1.6rem;font-weight:600;letter-spacing:.02em;margin:.2rem 0 1.2rem;}
  .frame{position:relative;background:rgba(24,24,27,.6);border:1px solid var(--border);padding:1rem;width:100%;text-align:left;color:inherit;}
  .frame .corner{position:absolute;width:12px;height:12px;}
  .frame .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);}
  .frame .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
  .day-card{margin-bottom:.75rem;background:#000;border:none;padding:0;}
  .day-card .frame{padding:1rem;}
  .day-row{display:flex;align-items:center;justify-content:space-between;}
  .day-badge{display:flex;align-items:center;justify-content:center;min-width:2.5rem;height:2.5rem;padding:0 .4rem;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);font-family:var(--font-mono);font-size:.64rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
  .btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.8rem;letter-spacing:.2em;}
  .btn-outline:hover{border-color:var(--border-hover);color:var(--text);}
  .btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem;border:none;background:var(--lime);color:#000;font-family:var(--font-display);font-weight:600;font-size:.85rem;letter-spacing:.1em;}
  .chip-row{display:flex;gap:.5rem;margin-bottom:1.5rem;}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem;border:1px solid var(--border);background:transparent;color:var(--text-mute);font-size:.72rem;letter-spacing:.2em;}
  .chip.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .set-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
  .set-idx{width:1.2rem;text-align:center;font-size:.72rem;color:var(--accent);}
  .set-input{width:100%;background:#09090b;border:1px solid var(--border);padding:.4rem .5rem;color:var(--text);font-size:.9rem;}
  .set-input:focus{outline:none;border-color:var(--border-hover);}
  .x-btn{background:none;border:none;color:var(--text-faint);padding:.2rem;}
  .add-set{margin-top:.5rem;display:flex;align-items:center;gap:.3rem;background:none;border:none;font-size:.72rem;letter-spacing:.2em;color:var(--accent);padding:0;}
  .pool-wrap{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;}
  .pool-btn{display:flex;align-items:center;gap:.3rem;padding:.55rem .8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.85rem;}
  .pool-btn:hover{border-color:var(--border-hover);color:var(--text);}
  .pool-item{display:flex;align-items:center;gap:.15rem;}
  .edit-toggle{display:flex;align-items:center;gap:.35rem;background:none;font-size:.68rem;letter-spacing:.15em;padding:.4rem .7rem;}
  .edit-toggle:hover{opacity:.85;}
  .pool-edit-row{display:flex;align-items:center;gap:.4rem;width:100%;margin-bottom:.5rem;}
  .back{display:flex;align-items:center;gap:.25rem;background:none;border:none;color:var(--text-mute);font-size:.9rem;margin-bottom:1.2rem;padding:0;}
  .save-btn{width:100%;padding:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;letter-spacing:.15em;color:#000;border:none;background:var(--accent);font-family:var(--font-display);font-size:1rem;}
  .save-btn:disabled{background:var(--border);color:var(--text-faint);}
  .ex-card{margin-bottom:.75rem;}
  .ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
  .ex-title{font-weight:500;cursor:pointer;}
  .hist-row{width:100%;display:block;text-align:left;border:1px solid var(--border);padding:.7rem 1rem;background:none;color:inherit;margin-bottom:.5rem;}
  .hist-top{display:flex;align-items:center;justify-content:space-between;}
  .hist-left{display:flex;align-items:center;gap:.75rem;}
  .hist-date{min-width:3.5rem;flex-shrink:0;text-align:left;}
  .hist-wd{font-size:.62rem;color:var(--text-mute);}
  .hist-d{font-size:.85rem;}
  .hist-right{display:flex;align-items:center;gap:.5rem;}
  .tag{font-size:.72rem;letter-spacing:.2em;}
  .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .6rem;font-size:.72rem;border:1px solid;margin-right:.5rem;}
  .set-pill{padding:.25rem .5rem;background:#09090b;border:1px solid var(--border);font-size:.85rem;margin:0 .4rem .4rem 0;display:inline-block;}
  .del-confirm{display:flex;gap:.5rem;}
  .del-confirm button{flex:1;padding:.8rem;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:.85rem;letter-spacing:.15em;}
  .del-confirm .yes{background:var(--pink);color:#000;border:none;font-weight:600;}
  .empty{color:var(--text-faint);font-size:.85rem;font-family:var(--font-mono);}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
  .stat-num{font-size:1.6rem;color:var(--lime);text-align:right;}
  .stat-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--text-mute);text-align:right;}
  .streak-btn{background:transparent;border:1.5px solid var(--pink);padding:.5rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;min-width:4.5rem;}
  .streak-btn .streak-num{font-family:var(--font-mono);font-size:1.5rem;color:var(--pink);line-height:1;}
  .streak-btn .streak-label{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.15em;color:var(--pink);}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  .pulse{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.55rem .5rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);min-width:3.4rem;flex:1 1 0;}
  .mood-btn span.lbl{font-size:.55rem;letter-spacing:.04em;text-align:center;}
  .mood-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .mood-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border);outline:none;border-radius:999px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);cursor:pointer;margin-top:-6px;border:none;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--lime);border:none;cursor:pointer;}
  .energy-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;}
  .perfect-btn{border-color:var(--gold) !important;color:var(--gold) !important;}
  .swatch{width:2.1rem;height:2.1rem;border-radius:999px;border:2px solid transparent;padding:0;}
  .mood-btn span.mood-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .score-wrap{display:flex;align-items:center;gap:.5rem;}
  .score-bar{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden;}
  .score-fill{height:100%;border-radius:999px;transition:width .25s ease;}
  .score-pct{font-size:.75rem;min-width:2.6rem;text-align:right;}
  .score-card{margin-bottom:1.2rem;}
  .score-legend{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-mute);margin-top:.5rem;flex-wrap:wrap;gap:.3rem;}
  textarea.set-input{width:100%;min-height:3.2rem;resize:vertical;font-family:var(--font-body);font-size:.85rem;}
  #bottomNav{position:fixed;left:0;right:0;bottom:0;background:#050505;border-top:1px solid var(--border);display:none;z-index:80;padding-bottom:env(safe-area-inset-bottom);max-width:480px;margin:0 auto;}
  #bottomNav.visible{display:flex;}
  @media (min-width:860px){#bottomNav{max-width:920px;}}
  #bottomNav .nav-btn{flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.75rem .3rem .65rem;font-family:var(--font-mono);font-size:.52rem;letter-spacing:.12em;position:relative;transition:color .15s;}
  #bottomNav .nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  #bottomNav .nav-btn.active{color:var(--lime);}
  #bottomNav .nav-btn.active svg{stroke-width:2;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--lime) 50%,transparent));}
  #bottomNav .nav-btn.active::before{content:'';position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--lime);box-shadow:0 0 8px color-mix(in srgb,var(--lime) 60%,transparent);}
  .weight-suggest{font-family:var(--font-mono);font-size:.55rem;color:var(--lime);margin-left:.3rem;opacity:.75;}
  .move-btn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:.15rem .4rem;font-size:.7rem;line-height:1;margin-left:.2rem;}
  .header-row{display:grid;gap:.5rem;margin-bottom:.35rem;}
  .header-label{font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;color:var(--text-faint);}
  .set-grid-pro{display:grid;grid-template-columns:1.5rem 1fr 1fr 1fr 1.5rem;gap:.5rem;align-items:center;margin-bottom:.5rem;}
  .set-grid-norm{display:grid;grid-template-columns:1.5rem 1fr auto 1fr 1.5rem;gap:.5rem;align-items:center;margin-bottom:.5rem;}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--lime);color:#000;padding:.7rem 1.4rem;font-family:var(--font-mono);font-size:.8rem;letter-spacing:.1em;z-index:999;box-shadow:0 4px 20px rgba(163,230,53,.4);transition:opacity .3s;font-weight:600;}
  .info-btn{position:absolute;top:.7rem;right:.7rem;width:22px;height:22px;border-radius:50%;border:1px solid var(--border-hover);background:#09090b;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.75rem;cursor:pointer;padding:0;line-height:1;z-index:5;font-weight:600;}
  .info-btn:hover{border-color:var(--lime);color:var(--lime);}
  .info-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:1.5rem;}
  .info-box{background:#0a0a0b;border:1px solid var(--border);padding:1.4rem;max-width:400px;width:100%;position:relative;}
  .info-box .ic{position:absolute;width:12px;height:12px;border-color:var(--lime);}
  .info-box .ic.tl{top:-1px;left:-1px;border-top:2px solid var(--lime);border-left:2px solid var(--lime);}
  .info-box .ic.tr{top:-1px;right:-1px;border-top:2px solid var(--lime);border-right:2px solid var(--lime);}
  .info-box .ic.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--lime);border-left:2px solid var(--lime);}
  .info-box .ic.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--lime);border-right:2px solid var(--lime);}
  .info-box h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 1rem;color:var(--text);letter-spacing:.02em;}
  .info-box p{font-size:.85rem;line-height:1.7;color:var(--text-dim);margin:0 0 .8rem;}
  .info-box .close-btn{width:100%;padding:.85rem;background:var(--lime);border:none;color:#000;font-weight:600;letter-spacing:.15em;font-family:var(--font-display);font-size:.85rem;margin-top:.5rem;}
  .scale-wrap{margin-bottom:.6rem;}
  .scale-wrap.compact{margin-bottom:0;}
  .scale-bar{display:flex;align-items:center;gap:4px;height:34px;}
  .scale-seg{position:relative;flex:1;height:20px;border-radius:3px;transition:all .3s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .scale-seg::after{content:'';position:absolute;top:-8px;bottom:-8px;left:-2px;right:-2px;}
  .scale-bar[data-sb] .scale-seg{cursor:pointer;}
  .scale-seg.on{flex:1.5;height:30px;}
  .scale-seg.sel{outline:1px solid #f4f4f5;outline-offset:1px;}
  .scale-bar.compact{height:24px;gap:3px;}
  .scale-bar.compact .scale-seg{height:12px;}
  .scale-bar.compact .scale-seg::after{top:-6px;bottom:-6px;left:-1.5px;right:-1.5px;}
  .scale-bar.compact .scale-seg.on{height:18px;}
  .scale-cap{display:none;margin-top:.4rem;font-size:.68rem;color:var(--text-dim);}
  .scale-cap.show{display:block;}
  .ring-wrap{display:flex;align-items:center;gap:1rem;}
  .ring-svg{width:120px;height:120px;flex-shrink:0;}
  .body-svg{width:120px;height:250px;flex-shrink:0;}
  .sub-row{display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px dashed var(--border);}
  .sub-row:last-child{border-bottom:none;}
  .single-value{display:flex;align-items:baseline;gap:.4rem;margin:.6rem 0;}
  .single-value .num{font-family:var(--font-display);font-size:2.4rem;font-weight:600;line-height:1;}
  .single-value .unit{font-family:var(--font-mono);font-size:.8rem;color:var(--text-mute);}
  .icon-med{width:56px;height:56px;flex-shrink:0;}
  .term-help{font-size:.6rem;color:var(--text-faint);font-weight:400;margin-left:.4rem;cursor:help;border-bottom:1px dotted var(--text-faint);}
  .scan-actions{display:flex;gap:.5rem;margin-top:1rem;}
  .scan-actions .btn-outline, .scan-actions .save-btn{width:auto;flex:1;font-size:.7rem;padding:.7rem;}
</style>

function calcAge(birthDateIso){
  if(!birthDateIso) return null;
  const b = new Date(birthDateIso);
  if(isNaN(b.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
  return age;
}
function getProfileAge(profile){
  if(!profile) return null;
  if(profile.birthDate){ const a = calcAge(profile.birthDate); if(a) return a; }
  const a = parseFloat(profile.age);
  return isNaN(a) ? null : a;
}
function humanFactor(profile){
  if(!profile) return null;
  const w = parseFloat(profile.weight); const a = getProfileAge(profile);
  if(!w || !a || !profile.gender || !profile.experience) return null;
  const gf = profile.gender === 'w' ? 0.65 : 1.0;
  const wf = w / 80;
  let af;
  if(a > 30) af = Math.max(0.5, 1 - (a-30)*0.008);
  else if(a < 30) af = Math.min(1.15, 1 + (30-a)*0.005);
  else af = 1.0;
  const ef = profile.experience === 'anfaenger' ? 0.6 : profile.experience === 'erfahren' ? 1.4 : 1.0;
  return gf * wf * af * ef;
}
function humanEstimate(exName, profile){
  const f = humanFactor(profile);
  if(f == null) return null;
  const base = HUMAN_REFERENCE[exName] || (HUMAN_REFERENCE.__overall__ * 0.25);
  return base * f;
}
function isProfileComplete(p){ return !!(p && p.weight && getProfileAge(p) && p.gender && p.experience); }

function sessionVolume(s){
  let vol = 0;
  (s.exercises||[]).forEach(ex=>{ (ex.sets||[]).forEach(st=>{
    const w = parseFloat(st.weight), r = effectiveReps(st);
    if(!isNaN(w) && !isNaN(r)) vol += w*r;
  });});
  return vol;
}
function dayTypeVolumes(dayType, excludeId){ return state.sessions.filter(s=>s.dayType===dayType && s.id!==excludeId).map(sessionVolume).filter(v=>v>0); }
function computeScore(session){
  const vols = dayTypeVolumes(session.dayType, session.id);
  const avgVol = vols.length ? vols.reduce((a,b)=>a+b,0)/vols.length : null;
  const recordVol = vols.length ? Math.max(...vols) : null;
  const vol = sessionVolume(session);
  let training = null;
  if(avgVol){ training = Math.min(140, (vol/avgVol)*100); } else if(vol>0){ training = 100; }
  let overall = training;
  if(overall!=null) overall = Math.max(0, Math.min(110, Math.round(overall)));
  const profile = loadProfile();
  let humanVol = null, humanPct = null;
  if(isProfileComplete(profile) && vol>0){
    const est = humanEstimate('__overall__', profile);
    if(est){ humanVol = est; humanPct = Math.round((vol/est)*100); }
  }
  const recordPct = (recordVol && vol) ? Math.round((vol/recordVol)*100) : null;
  return {overall, training:training!=null?Math.round(training):null, vol, avgVol, recordVol, recordPct, humanVol, humanPct};
}

function weekMondayKey(dateLike){ const d = new Date(dateLike); const day = d.getDay(); const diff = (day===0?-6:1-day); d.setHours(0,0,0,0); d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10); }
function weekDistinctDaysFrom(sessions){
  const wd = {};
  sessions.forEach(s=>{
    const k = weekMondayKey(s.date);
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const dayKey = d.toISOString().slice(0,10);
    if(!wd[k]) wd[k] = new Set();
    wd[k].add(dayKey);
  });
  const counts = {};
  Object.keys(wd).forEach(k=>{ counts[k] = wd[k].size; });
  return counts;
}
function currentStreakWeeks(sessions){
  const wc = weekDistinctDaysFrom(sessions);
  let cursor = new Date(); let streak = 0, first = true;
  for(let i=0;i<1000;i++){
    const key = weekMondayKey(cursor);
    const count = wc[key] || 0;
    if(first){ if(count>=3) streak++; } else { if(count>=3) streak++; else break; }
    first = false;
    cursor = new Date(cursor.getTime() - 7*86400000);
  }
  return streak;
}
function longestStreakWeeks(sessions){
  if(!sessions.length) return 0;
  const wc = weekDistinctDaysFrom(sessions);
  const weekTimes = Object.keys(wc).map(k=>new Date(k).getTime());
  const minT = Math.min(...weekTimes);
  const lastCompleted = new Date(weekMondayKey(new Date())); lastCompleted.setDate(lastCompleted.getDate()-7);
  const maxT = lastCompleted.getTime();
  let run = 0, best = 0;
  for(let t=minT; t<=maxT; t+=7*86400000){
    const key = weekMondayKey(new Date(t)); const count = wc[key] || 0;
    if(count>=3){ run++; best = Math.max(best,run); } else run = 0;
  }
  return Math.max(best, currentStreakWeeks(sessions));
}
function weeksSince(sessions){
  if(!sessions.length) return 0;
  const earliest = sessions.reduce((min,s)=> new Date(s.date)<new Date(min.date)?s:min, sessions[0]);
  const diffDays = (new Date() - new Date(earliest.date)) / 86400000;
  return Math.max(1, Math.round(diffDays/7));
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object') throw new Error('Ungültige Datei');
      const msg = 'Achtung: Alle aktuellen Daten werden durch das Backup ersetzt.\n\n' +
        'Backup vom: ' + (data.exportedAt ? new Date(data.exportedAt).toLocaleString('de-DE') : 'unbekannt') + '\n' +
        'Sessions im Backup: ' + (Array.isArray(data.sessions) ? data.sessions.length : 0) + '\n' +
        'Body-Scans im Backup: ' + (Array.isArray(data.bodyScans) ? data.bodyScans.length : 0) + '\n\n' + 'Fortfahren?';
      if(!confirm(msg)) return;
      if(Array.isArray(data.sessions)) state.sessions = data.sessions;
      if(Array.isArray(data.bodyScans)) state.bodyScans = data.bodyScans;
      if(Array.isArray(data.customDays)) saveCustomDays(data.customDays);
      if(data.customPool && typeof data.customPool === 'object') saveCustomPool(data.customPool);
      if(data.exOverrides && typeof data.exOverrides === 'object') saveExOverrides(data.exOverrides);
      if(data.profile && typeof data.profile === 'object'){ saveProfile(data.profile); state.profile = data.profile; }
      saveSessions(state.sessions); saveBodyScans(state.bodyScans);
      alert('Backup erfolgreich wiederhergestellt!\n\nSessions: ' + state.sessions.length + '\nBody-Scans: ' + state.bodyScans.length);
      render();
    }catch(err){ alert('Fehler beim Importieren: ' + err.message); }
  };
  reader.readAsText(file);
}

function normalizeScans(arr){

  return arr.filter(x=>x && typeof x==='object').map(sc=>{
    const o = {...sc};
    Object.keys(o).forEach(k=>{ if(k!=='date' && typeof o[k]==='string' && o[k].trim()!=='' && isFinite(Number(o[k]))) o[k] = Number(o[k]); });

function getPool(key){
  const builtin = BUILTIN_DAY_TYPES[key] ? BUILTIN_DAY_TYPES[key].pool : [];
  const custom = loadCustomPool()[key] || [];
  let names = [...builtin, ...custom];
  const ov = loadExOverrides()[key];
  if(ov){
    if(ov.renamed) names = names.map(n => ov.renamed[n] || n);
    if(ov.deleted) names = names.filter(n => !ov.deleted.includes(n));
  }
  return [...new Set(names)];
}
function isPerArm(dayKey, name){ const ov = loadExOverrides(); return !!(ov[dayKey] && ov[dayKey].perArm && ov[dayKey].perArm[name]); }
function togglePerArm(dayKey, name){
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};

  ov[dayKey].perArm[name] = !ov[dayKey].perArm[name];

function effectiveReps(st){
  if(st.repsLeft!==undefined || st.repsRight!==undefined){
    const l = parseFloat(st.repsLeft), r = parseFloat(st.repsRight);
    return (isNaN(l)?0:l) + (isNaN(r)?0:r);
  }
  return parseFloat(st.reps);
}
function renameExercise(dayKey, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};
  if(!ov[dayKey].renamed) ov[dayKey].renamed = {};
  ov[dayKey].renamed[oldName] = newName;
  saveExOverrides(ov);
  state.sessions.forEach(s=>{ if(s.dayType===dayKey) s.exercises.forEach(ex=>{ if(ex.name===oldName) ex.name = newName; }); });
  saveSessions(state.sessions);
  if(state.draft && state.draft.dayType===dayKey){ state.draft.exercises.forEach(ex=>{ if(ex.name===oldName) ex.name = newName; }); }
}
function deleteExercise(dayKey, name){
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};
  if(!ov[dayKey].deleted) ov[dayKey].deleted = [];
  if(!ov[dayKey].deleted.includes(name)) ov[dayKey].deleted.push(name);
  saveExOverrides(ov);
}

function kraftwerteByGroup(){
  const DAYS = getDayTypes();
  const result = [];
  const seen = new Set();
  const sortedSessions = [...state.sessions].sort((a,b)=> new Date(b.date) - new Date(a.date));
  Object.values(DAYS).forEach(day=>{
    const items = [];
    day.pool.forEach(name=>{
      if(seen.has(name)) return;
      let latestWeight = 0;
      for(const s of sortedSessions){
        const ex = s.exercises.find(e=>e.name===name);
        if(!ex) continue;
        for(const st of ex.sets){
          const w = parseFloat(st.weight);
          if(!isNaN(w) && w > 0){ latestWeight = w; break; }
        }

function suggestNextWeightFor(exName, lastSets){
  if(!lastSets || !lastSets.length) return null;
  const inc = getIncrement(exName);
  const weightsSorted = lastSets.map(s=>s.weight).sort((a,b)=>a-b);
  const mid = Math.floor(weightsSorted.length / 2);
  const medianWeight = weightsSorted.length % 2 === 0
    ? (weightsSorted[mid-1] + weightsSorted[mid]) / 2 : weightsSorted[mid];
  const atMedian = lastSets.filter(s=> s.weight === medianWeight);
  const minRepsAtMedian = Math.min(...atMedian.map(s=>s.reps));
  const maxRepsAtMedian = Math.max(...atMedian.map(s=>s.reps));
  const minRepsAll = Math.min(...lastSets.map(s=>s.reps));
  if(minRepsAtMedian >= 12){ return { weight: medianWeight + inc, action: 'too_low', reason: `Median ${medianWeight} kg · alle Sätze ≥ 12 Wdh – +${inc} kg drauf` }; }
  if(minRepsAll < 8){ return { weight: Math.max(0, medianWeight - inc), action: 'too_high', reason: `Mind. 1 Satz unter 8 Wdh (${minRepsAll}) – ${inc} kg runter` }; }
  return { weight: medianWeight, action: 'fit', reason: `Median ${medianWeight} kg · ${minRepsAtMedian}–${maxRepsAtMedian} Wdh – halten` };
}

function parseVicoachText(raw){
  const t = raw.replace(/\s+/g,' ');
  const result = {date: new Date().toISOString().slice(0,10)};
  const numOf = (str) => { if(!str) return null; const n = parseFloat(String(str).replace(',','.')); return isNaN(n) ? null : n; };
  let m = t.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(m){ result.date = `${m[3]}-${m[2]}-${m[1]}`; }
  else { m = t.match(/(\d{4})\/(\d{2})\/(\d{2})/); if(m) result.date = `${m[1]}-${m[2]}-${m[3]}`; }
  function findNear(keyword, opts){
    opts = opts || {};
    const lower = t.toLowerCase();
    const kw = keyword.toLowerCase();
    const idx = lower.indexOf(kw);
    if(idx < 0) return null;
    const after = t.substring(idx + kw.length, idx + kw.length + 200);
    const afterNums = after.match(/(\d+[.,]\d+|\d+)/g) || [];
    const before = t.substring(Math.max(0, idx - 200), idx);
    const beforeNums = (before.match(/(\d+[.,]\d+|\d+)/g) || []).slice(-3);
    const candidates = [...afterNums.slice(0,3), ...beforeNums];
    for(const c of candidates){
      const n = numOf(c);
      if(n == null) continue;
      if(opts.min != null && n < opts.min) continue;
      if(opts.max != null && n > opts.max) continue;
      if(n > 1900 && n < 2100) continue;
      if(opts.min == null && n < 0.1) continue;
      return n;
    }
    return null;
  }
  const g = findNear('Gewicht', {min: 30, max: 200}); if(g!=null) result.weight = g;
  const mm = findNear('Muskelmasse', {min: 10, max: 100}); if(mm!=null) result.muscle = mm;
  const mp = findNear('Muskelprotein', {min: 5, max: 30}); if(mp!=null) result.muscleProtein = mp;
  const mw = findNear('Wasser im Muskel', {min: 5, max: 40}); if(mw!=null) result.muscleWater = mw;
  const f = findNear('Fettmasse', {min: 1, max: 80}); if(f!=null) result.fat = f;
  const fe = findNear('Essentielles Fett', {min: 1, max: 20}); if(fe!=null) result.fatEssential = fe;
  const fr = findNear('Fettreserve', {min: 0, max: 40}); if(fr!=null) result.fatReserve = fr;
  const vz = findNear('Viszerales Fett', {min: 0, max: 10}); if(vz!=null) result.visceral = vz;
  const cf = findNear('Zellfitnesswert', {min: 2, max: 12});
  if(cf!=null) result.cellFit = cf;
  else { const c2 = findNear('Phasenwinkel', {min: 2, max: 12}); if(c2!=null) result.cellFit = c2; }
  const hrv = findNear('HRV-Trainingsbereitschaft', {min: 5, max: 250});
  if(hrv!=null) result.hrv = hrv;
  else { const h2 = findNear('HRV', {min: 5, max: 250}); if(h2!=null) result.hrv = h2; }
  const oxy = findNear('Sauerstoffsättigung', {min: 70, max: 100});
  if(oxy!=null) result.oxygen = oxy;
  else { const o2 = findNear('SpO2', {min: 70, max: 100}); if(o2!=null) result.oxygen = o2; }
  const hr = findNear('Herzfrequenz', {min: 30, max: 150}); if(hr!=null) result.hr = hr;
  const ba = findNear('Bioage', {min: 5, max: 90}); if(ba!=null) result.bioage = ba;
  // Körperwasser gesamt (vicoach: "Körperwasser" / "Wasser")
  let wt = findNear('Körperwasser', {min: 20, max: 70});
  if(wt == null) wt = findNear('Wasser', {min: 20, max: 70});
  if(wt != null) result.water = wt;
  const wi = findNear('Intrazelluläres Wasser', {min: 10, max: 60}); if(wi!=null) result.waterIntra = wi;
  const we = findNear('Extrazelluläres Wasser', {min: 5, max: 40}); if(we!=null) result.waterExtra = we;
  if(result.water == null && result.waterIntra != null && result.waterExtra != null){
    result.water = Math.round((result.waterIntra + result.waterExtra) * 10) / 10;
  }
  const t1 = findNear('Torso', {min: 5, max: 40}); if(t1!=null) result.muscleTorso = t1;
  const aR = findNear('Arm R', {min: 1, max: 15}); if(aR!=null) result.muscleArmR = aR;
  const aL = findNear('Arm L', {min: 1, max: 15}); if(aL!=null) result.muscleArmL = aL;
  const lR = findNear('Bein R', {min: 3, max: 25}); if(lR!=null) result.muscleLegR = lR;
  const lL = findNear('Bein L', {min: 3, max: 25}); if(lL!=null) result.muscleLegL = lL;
  console.log('=== PDF PARSED ===', result);
  return result;
}

const SCALE_BOX_COLORS = ['#b01c1c','#cd4a19','#ee8a18','#f5d42a','#cdee14','#82cf16','#47b21b'];
function scaleBoxIndex(pct){
  const p = Math.max(0, Math.min(100, Number(pct)));
  return Math.min(SCALE_BOX_COLORS.length - 1, Math.floor((isFinite(p) ? p : 50) / 100 * SCALE_BOX_COLORS.length));
}
function scaleBoxColor(pct){ return SCALE_BOX_COLORS[scaleBoxIndex(pct)]; }
// Position (0-100) des aktuellen Werts in der eigenen Spanne (niedrigster bis höchster Scan).
// goodUp=false dreht die Richtung um (niedriger = besser). Ohne Spanne: Mitte.
function scanPos(scans, get, goodUp, curOverride){
  const vals = scans.map(get).filter(v=>typeof v==='number' && isFinite(v));
  const cur = curOverride != null ? curOverride : (scans.length ? get(scans[scans.length-1]) : null);
  if(typeof cur !== 'number' || !isFinite(cur) || vals.length < 2) return 50;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  if(mx - mn < 1e-9) return 50;
  const p = Math.max(0, Math.min(100, (cur - mn) / (mx - mn) * 100));
  return goodUp ? p : 100 - p;
}
function scaleBar(positionPct, compact, attrs){
  const idx = scaleBoxIndex(positionPct);
  const segsHtml = SCALE_BOX_COLORS.map((c,i)=>`<div class="scale-seg${i===idx?' on':''}" style="background:${c};"></div>`).join('');
  return `<div class="scale-wrap${compact?' compact':''}"><div class="scale-bar${compact?' compact':''}"${attrs||''}>${segsHtml}</div><div class="scale-cap mono"></div></div>`;
}
// Balken mit antippbaren Kästchen: zeigt pro Kästchen den Wertebereich (aus deinem eigenen Verlauf)
function scaleBarFor(scans, get, goodUp, unit, dec, compact, curOverride){
  const vals = scans.map(get).filter(v=>typeof v==='number' && isFinite(v));
  const cur = curOverride != null ? curOverride : (scans.length ? get(scans[scans.length-1]) : null);
  const pos = scanPos(scans, get, goodUp, curOverride);
  const mn = vals.length ? Math.min(...vals) : 0, mx = vals.length ? Math.max(...vals) : 0;
  const hasRange = vals.length >= 2 && mx - mn >= 1e-9 && typeof cur === 'number' && isFinite(cur);
  const attrs = hasRange
    ? ` data-sb="1" data-min="${mn}" data-max="${mx}" data-up="${goodUp?1:0}" data-unit="${unit}" data-dec="${dec}" data-cur="${cur}"`
    : ` data-sb="1" data-none="1"`;
  return scaleBar(pos, compact, attrs);
}
document.addEventListener('click', (e)=>{

  if(cap.classList.contains('show') && cap.getAttribute('data-idx') === String(idx)){ cap.classList.remove('show'); return; }
  seg.classList.add('sel');
  cap.setAttribute('data-idx', idx);

  if(bar.hasAttribute('data-none')){
    txt = 'Noch keine Spanne: Dafür brauchst du mindestens 2 verschiedene Messwerte.';
  } else {
    const mn = +bar.dataset.min, mx = +bar.dataset.max, up = bar.dataset.up === '1', dec = +bar.dataset.dec, unit = bar.dataset.unit, cur = +bar.dataset.cur;
    const fmt = v => v.toFixed(dec).replace('.', ',');
    const val = p => up ? mn + p * (mx - mn) : mx - p * (mx - mn);
    const lo = val(idx / 7), hi = val((idx + 1) / 7);
    let range;
    if(idx === 0) range = up ? `bis ${fmt(hi)}` : `ab ${fmt(hi)}`;
    else if(idx === 6) range = up ? `ab ${fmt(lo)}` : `bis ${fmt(lo)}`;
    else range = `${fmt(Math.min(lo, hi))}–${fmt(Math.max(lo, hi))}`;
    const p = Math.max(0, Math.min(100, (cur - mn) / (mx - mn) * 100));
    const here = idx === scaleBoxIndex(up ? p : 100 - p);
    txt = `${range} ${unit}` + (here ? ` · hier bist du (${fmt(cur)} ${unit})` : '');
  }
  cap.textContent = txt;
  cap.classList.add('show');
});
function donut(segments, centerValue, centerUnit, colors){
  const size = 120, r = 46, cx = size/2, cy = size/2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((a,b)=>a+b.value, 0) || 1;
  let offset = 0;
  const arcs = segments.map((seg, i)=>{
    const len = (seg.value / total) * circumference;
    const arc = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="18"
      stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    offset += len;
    return arc;
  }).join('');
  return `<svg class="ring-svg" viewBox="0 0 ${size} ${size}">
    ${arcs}
    <circle cx="${cx}" cy="${cy}" r="${r-9}" fill="#000"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#f4f4f5" font-size="20" font-family="Oswald, sans-serif" font-weight="600">${centerValue}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" fill="#71717a" font-size="10" font-family="JetBrains Mono, monospace">${centerUnit}</text>
  </svg>`;
}

function renderBottomNav(){
  const el = document.getElementById('bottomNav');
  if(!el) return;
  if(!MAIN_TABS.includes(state.view) || (fbEnabled && !authUser)){ el.classList.remove('visible'); el.innerHTML = ''; return; }
  el.classList.add('visible');
  const tabs = [
    {id:'home',icon:'home',label:'HOME'},
    {id:'history',icon:'history',label:'VERLAUF'},
    {id:'scan',icon:'scan',label:'SCAN'},
    {id:'profile',icon:'profile',label:'PROFIL'},
  ];
  el.innerHTML = tabs.map(t=>`<button class="nav-btn ${state.view===t.id?'active':''}" data-nav="${t.id}">${NAV_ICONS[t.icon]}<span>${t.label}</span></button>`).join('');
  el.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ state.view = b.getAttribute('data-nav'); state.modal = null; render(); }));
}
function render(){
  try{ renderInner(); }
  catch(err){
    console.error('Render-Fehler', err);
    try{
      const msg = String((err && err.message) || err).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      const where = String((err && err.stack) || '').split('\n').slice(1,3).join(' ').replace(/&/g,'&amp;').replace(/</g,'&lt;').slice(0,300);
      app.innerHTML = `<div class="eyebrow mono">FEHLER</div><div class="h1 display" style="margin-bottom:.8rem;">ANZEIGE FEHLGESCHLAGEN</div>
        <div class="mono" style="color:var(--red);font-size:.75rem;line-height:1.5;margin-bottom:.6rem;word-break:break-word;">${msg}</div>
        <div class="mono" style="color:var(--text-faint);font-size:.6rem;line-height:1.4;margin-bottom:1.2rem;word-break:break-all;">${state.view} · ${where}</div>
        <button class="btn-primary" id="renderErrHome" style="width:100%;font-size:.75rem;">ZURÜCK ZU HOME</button>`;
      const hb = document.getElementById('renderErrHome');
      if(hb) hb.addEventListener('click', ()=>{ state.view='home'; state.modal=null; currentInfo=null; render(); });
    }catch(e2){ console.error(e2); }
  }
}
function renderInner(){
  if(fbEnabled && !authUser && authChecked){ state.view = 'auth'; }
  persistDraft(); syncHistory();
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='newday') app.innerHTML = renderNewDay();
  else if(state.view==='editday') app.innerHTML = renderEditDay();
  else if(state.view==='session') app.innerHTML = renderSession();
  else if(state.view==='history') app.innerHTML = renderHistory();
  else if(state.view==='streak') app.innerHTML = renderStreak();
  else if(state.view==='auth') app.innerHTML = renderAuth();
  else if(state.view==='detail') app.innerHTML = renderDetail();
  else if(state.view==='profile') app.innerHTML = renderProfile();
  else if(state.view==='scan') app.innerHTML = renderScan();
  else if(state.view==='scan-form') app.innerHTML = renderScanForm();
  else if(state.view==='scan-list') app.innerHTML = renderScanList();
  else if(state.view==='exercise') app.innerHTML = renderExerciseDetail();
  app.innerHTML += renderModalOverlay();
  app.innerHTML += renderScanInfoOverlay();
  attachListeners();
  renderBottomNav();
}

function scanLineChart(scans, key, color){
  const pts = scans.map((s,i)=>({v: parseFloat(s[key]), i})).filter(p=>!isNaN(p.v));
  if(pts.length < 2) return '';
  const vals = pts.map(p=>p.v);
  const w = 260, h = 55, padL = 8, padR = 8, padT = 8, padB = 8;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = Math.max(max - min, 0.5);
  const stepX = (w - padL - padR) / (pts.length - 1);
  const sY = v => h - padB - ((v - min) / range) * (h - padT - padB);
  const path = pts.map((p, i) => `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${sY(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => {
    const isLast = i === pts.length - 1;
    const cx = (padL+i*stepX).toFixed(1);
    const cy = sY(p.v).toFixed(1);
    return `<circle cx="${cx}" cy="${cy}" r="${isLast?5:2.5}" fill="${isLast?color:'#52525b'}" stroke="#000" stroke-width="1" style="cursor:pointer;" data-scan-point="${p.i}"/>
            <circle cx="${cx}" cy="${cy}" r="12" fill="transparent" style="cursor:pointer;" data-scan-point="${p.i}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;margin-top:.6rem;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>${dots}
  </svg>`;
}
function avgOf(scans, key){
  const vals = scans.map(s=>parseFloat(s[key])).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function calcBioageAssessment(bioage, calAge){
  const cal = parseFloat(calAge) || 17;
  const bio = parseFloat(bioage);
  const diffPct = isNaN(bio) ? 0 : ((bio - cal) / cal) * 100;
  let verdict, color, iconType;
  if(diffPct <= -15){ verdict = 'DEUTLICH JÜNGER'; color = 'var(--lime)'; iconType = 'muscle'; }
  else if(diffPct < -5){ verdict = 'JÜNGER'; color = 'var(--green)'; iconType = 'muscle'; }
  else if(diffPct <= 5){ verdict = 'NORMAL'; color = 'var(--yellow)'; iconType = 'runner'; }
  else if(diffPct < 15){ verdict = 'ÄLTER'; color = 'var(--orange)'; iconType = 'grandpa'; }
  else { verdict = 'DEUTLICH ÄLTER'; color = 'var(--red)'; iconType = 'grandpa'; }
  const scalePos = Math.max(0, Math.min(100, 50 - diffPct * (50 / 30)));
  return { diffPct, verdict, color, iconType, scalePos };
}

  const last = scans[scans.length-1];
  const first = scans[0];
  const prev = scans.length > 1 ? scans[scans.length-2] : first;
  const firstDateStr = new Date(first.date).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const lastDateStr = new Date(last.date).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});

  const dist = {
    torso: last.muscleTorso != null ? last.muscleTorso : 16.1,
    armR: last.muscleArmR != null ? last.muscleArmR : 2.6,
    armL: last.muscleArmL != null ? last.muscleArmL : 2.6,
    legR: last.muscleLegR != null ? last.muscleLegR : 7.7,
    legL: last.muscleLegL != null ? last.muscleLegL : 7.7,
  };
  // Jeder Körperteil hat seine eigene Skala (eigener Verlauf: niedrigster Scan = rot, höchster = grün)
  const mvKeys = {torso:'muscleTorso', armR:'muscleArmR', armL:'muscleArmL', legR:'muscleLegR', legL:'muscleLegL'};
  const mvPos = {}, mvColors = {};
  Object.keys(mvKeys).forEach(k=>{ mvPos[k] = scanPos(scans, s=>s[mvKeys[k]], true, dist[k]); mvColors[k] = scaleBoxColor(mvPos[k]); });
  const armDiffPct = (dist.armR && dist.armL) ? (Math.abs(dist.armR - dist.armL) / Math.max(dist.armR, dist.armL)) * 100 : 0;
  const legDiffPct = (dist.legR && dist.legL) ? (Math.abs(dist.legR - dist.legL) / Math.max(dist.legR, dist.legL)) * 100 : 0;
  const maxDiffPct = Math.max(armDiffPct, legDiffPct);
  const balanced = maxDiffPct < 8;

  const waterTotal = last.water != null ? last.water : (last.waterIntra != null && last.waterExtra != null ? Math.round((last.waterIntra + last.waterExtra)*10)/10 : null);
  const waterIntra = last.waterIntra != null ? last.waterIntra : (waterTotal ? waterTotal * 0.62 : null);
  const waterExtra = last.waterExtra != null ? last.waterExtra : (waterTotal ? waterTotal * 0.38 : null);
  const fatEss = last.fatEssential != null ? last.fatEssential : (last.fat != null ? last.fat * 0.35 : null);
  const fatRes = last.fatReserve != null ? last.fatReserve : (last.fat != null ? last.fat * 0.65 : null);
  const musProtein = last.muscleProtein != null ? last.muscleProtein : (last.muscle != null ? last.muscle * 0.31 : null);
  const musWater = last.muscleWater != null ? last.muscleWater : (last.muscle != null ? last.muscle * 0.69 : null);
  const calAge = getProfileAge(state.profile) || 17;
  const bioageVal = last.bioage != null ? last.bioage : calAge;
  const bio = calcBioageAssessment(bioageVal, calAge);

  const waterPct = waterTotal != null && last.weight != null ? (waterTotal / last.weight * 100) : null;
  const fatPct = last.fat != null && last.weight != null ? (last.fat/last.weight*100) : (last.fatPct != null ? last.fatPct : null);
  const musPct = last.muscle != null && last.weight != null ? (last.muscle/last.weight*100) : null;
  const proteinPct = musProtein != null && last.muscle != null ? (musProtein/last.muscle*100) : null;
  const bmi = last.weight != null && state.profile.height ? (last.weight / Math.pow(state.profile.height/100, 2)) : null;
  const fatFreePct = fatPct != null ? (100 - fatPct) : null;

  const changeRows = [
    {label:'MUSKELMASSE', key:'muscle', goodUp:true, unit:'kg'},
    {label:'FETTMASSE', key:'fat', goodUp:false, unit:'kg'},
    {label:'GEWICHT', key:'weight', goodUp:false, unit:'kg'},
  ];
  const changeBlock = `
    <div class="frame" style="--accent:var(--lime);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="eyebrow mono" style="margin-bottom:1rem;">VERÄNDERUNG SEIT ${firstDateStr}</div>
      ${changeRows.map(r=>{
        const f = first[r.key], p = prev[r.key], l = last[r.key];
        if(f==null || l==null) return '';
        const dT = l - f, sT = dT > 0 ? '+' : '', aT = Math.abs(dT).toFixed(1);
        const gT = r.goodUp ? dT > 0 : dT < 0;
        const cT = Math.abs(dT) < 0.05 ? 'var(--text-mute)' : (gT ? 'var(--green)' : 'var(--red)');
        const symT = Math.abs(dT) < 0.05 ? '—' : (gT ? '↑' : '↓');
        const dL = (p != null && l != null) ? l - p : 0;
        const sL = dL > 0 ? '+' : '', aL = Math.abs(dL).toFixed(1);
        const gL = r.goodUp ? dL > 0 : dL < 0;
        const cL = Math.abs(dL) < 0.05 ? 'var(--text-mute)' : (gL ? 'var(--green)' : 'var(--red)');
        const symL = Math.abs(dL) < 0.05 ? '—' : (gL ? '↑' : '↓');
        let kette = `${f} `;
        if(p != null) kette += `<span style="color:var(--text-faint);">→</span> ${p} `;
        kette += `<span style="color:var(--text-faint);">→</span> <span style="color:var(--text);">${l}</span> ${r.unit}`;
        return `<div style="margin-bottom:1rem;">
          <div class="eyebrow mono" style="font-size:.6rem;color:${cT};margin-bottom:.35rem;">${r.label}</div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;">
            <div class="mono" style="font-size:.95rem;color:var(--text-dim);">${kette}</div>
            <div style="text-align:right;">
              <div class="mono" style="font-size:1rem;color:${cT};">${sT}${aT} ${r.unit} ${symT}</div>
              <div class="mono" style="font-size:.65rem;color:${cL};margin-top:.2rem;">${sL}${aL} ${r.unit} ${symL} <span style="color:var(--text-faint);">letzter</span></div>
            </div>
          </div>
        </div>`;
      }).join('')}
      <div class="mono" style="font-size:.55rem;color:var(--text-faint);margin-top:.3rem;text-align:right;">LETZTE MESSUNG: ${lastDateStr}</div>
    </div>`;

  return `
    <div class="eyebrow mono">BODY · VICOACH MESCAN</div>
    <div class="h1 display" style="margin-bottom:.3rem;">KÖRPERANALYSE</div>
    <div class="mono" style="font-size:.7rem;color:var(--text-mute);margin-bottom:1.2rem;letter-spacing:.1em;">${scans.length} MESSUNG${scans.length===1?'':'EN'}</div>
    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;">
      <button class="btn-primary" data-scan-action="pdf" style="flex:1;font-size:.7rem;">PDF HOCHLADEN</button>
      <button class="btn-outline mono" data-scan-action="manual" style="flex:1;font-size:.7rem;">MANUELL</button>
    </div>
    ${state.pdfError?`<div class="mono" style="color:var(--red);font-size:.7rem;margin-bottom:1rem;">${state.pdfError}</div>`:''}

    ${changeBlock}

    <!-- KÖRPERZUSAMMENSETZUNG -->
    <div class="frame" style="--accent:var(--lime);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('composition')}
      <div class="eyebrow mono" style="color:var(--lime);margin-bottom:.7rem;padding-right:1.6rem;">KÖRPERZUSAMMENSETZUNG</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem;">
        ${[
          {l:'BMI', v: bmi != null ? bmi.toFixed(1).replace('.',',') : '—', c:'var(--yellow)'},
          {l:'Fettfreie Masse', v: fatFreePct != null ? fatFreePct.toFixed(1).replace('.',',') + ' %' : '—', c:'var(--green)'},
          {l:'Wasser', v: waterPct != null ? waterPct.toFixed(1).replace('.',',') + ' %' : '—', c:'#38bdf8'},
          {l:'Muskelprotein', v: proteinPct != null ? proteinPct.toFixed(1).replace('.',',') + ' %' : '—', c:'var(--lime)'},
          {l:'Fettmasse', v: fatPct != null ? fatPct.toFixed(1).replace('.',',') + ' %' : '—', c:'#FFD700'},
          {l:'Überschüssig', v: '0,0 %', c:'var(--green)'},
        ].map(x=>`
          <div style="border-left:2px solid ${x.c};padding-left:.5rem;">
            <div class="eyebrow mono" style="font-size:.5rem;">${x.l.toUpperCase()}</div>
            <div class="mono" style="font-size:1rem;color:${x.c};">${x.v}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- MUSKELVERTEILUNG (Fix #2) -->
    <div class="frame" style="--accent:#a78bfa;padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('muscleDist')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;padding-right:1.6rem;">
        <div class="eyebrow mono" style="color:#a78bfa;">MUSKELVERTEILUNG</div>
        <div class="mono" style="font-size:.6rem;color:${balanced?'var(--green)':'var(--orange)'};">
          ${balanced ? '✓ AUSGEGLICHEN' : '⚠ UNGLEICH ' + maxDiffPct.toFixed(1) + '%'}
        </div>
      </div>
      <div style="display:flex;gap:1rem;align-items:center;">
        ${bodySilhouette(mvColors)}
        <div style="flex:1;min-width:0;">
          ${[
            {label:'Torso', key:'torso'},
            {label:'Arm R', key:'armR'},
            {label:'Arm L', key:'armL'},
            {label:'Bein R', key:'legR'},
            {label:'Bein L', key:'legL'},
          ].map(r=>{
            const val = dist[r.key], col = mvColors[r.key];
            return `<div style="margin-bottom:.55rem;">
              <div style="display:flex;justify-content:space-between;margin-bottom:.2rem;">
                <span class="mono" style="font-size:.65rem;color:var(--text-dim);">${r.label}</span>
                <span class="mono" style="font-size:.7rem;color:${col};">${val.toFixed(1).replace('.',',')} kg</span>
              </div>
              ${scaleBarFor(scans, s=>s[mvKeys[r.key]], true, 'kg', 1, true, dist[r.key])}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    ${waterTotal != null ? `
    <!-- WASSER -->
    <div class="frame" style="--accent:var(--sky);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('water')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;padding-right:1.6rem;">
        <div class="eyebrow mono" style="color:var(--sky);">KÖRPERWASSER</div>
        <div class="mono" style="text-align:right;">${waterPct?'<span style="font-size:1.15rem;font-weight:600;color:var(--accent);">'+waterPct.toFixed(1).replace('.',',')+' %</span> <span style="font-size:.6rem;color:var(--text-mute);">vom Gewicht</span>':''}</div>
      </div>
      ${scaleBarFor(scans, s=>s.water!=null ? s.water : ((s.waterIntra!=null && s.waterExtra!=null) ? s.waterIntra + s.waterExtra : null), true, 'kg', 1)}
      <div class="ring-wrap">
        ${donut([{value:waterIntra||1},{value:waterExtra||1}], waterTotal.toFixed(1).replace('.',','), 'kg', ['#38bdf8','#2563eb'])}
        <div style="flex:1;">
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Intrazellulär</span><span class="mono" style="font-size:.8rem;color:#38bdf8;">${waterIntra?waterIntra.toFixed(1).replace('.',','):'—'} kg</span></div>
          <div class="mono" style="font-size:.55rem;color:var(--text-faint);margin:.1rem 0 .3rem .1rem;">Wasser IN den Zellen</div>
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Extrazellulär</span><span class="mono" style="font-size:.8rem;color:#2563eb;">${waterExtra?waterExtra.toFixed(1).replace('.',','):'—'} kg</span></div>
          <div class="mono" style="font-size:.55rem;color:var(--text-faint);margin:.1rem 0 .3rem .1rem;">Wasser ZWISCHEN den Zellen</div>
        </div>
      </div>
      ${scanLineChart(scans, 'water', 'var(--sky)')}
    </div>` : ''}

    <!-- MUSKELMASSE -->
    <div class="frame" style="--accent:var(--lime);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('muscle')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;padding-right:1.6rem;">
        <div class="eyebrow mono" style="color:var(--lime);">MUSKELMASSE</div>
        <div class="mono" style="text-align:right;">${musPct?'<span style="font-size:1.15rem;font-weight:600;color:var(--accent);">'+musPct.toFixed(1).replace('.',',')+' %</span> <span style="font-size:.6rem;color:var(--text-mute);">vom Gewicht</span>':''}</div>
      </div>
      ${scaleBarFor(scans, s=>s.muscle, true, 'kg', 1)}
      <div class="ring-wrap">
        ${donut([{value:musProtein||1},{value:musWater||1}], last.muscle!=null?last.muscle.toFixed(1).replace('.',','):'—', 'kg', ['#84cc16','#2563eb'])}
        <div style="flex:1;">
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Muskelprotein</span><span class="mono" style="font-size:.8rem;color:#84cc16;">${musProtein?musProtein.toFixed(1).replace('.',','):'—'} kg</span></div>
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Wasser im Muskel</span><span class="mono" style="font-size:.8rem;color:#2563eb;">${musWater?musWater.toFixed(1).replace('.',','):'—'} kg</span></div>
        </div>
      </div>
      ${scanLineChart(scans, 'muscle', 'var(--lime)')}
    </div>

    <!-- FETTMASSE -->
    <div class="frame" style="--accent:#FFD700;padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('fat')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;padding-right:1.6rem;">
        <div class="eyebrow mono" style="color:#FFD700;">FETTMASSE</div>
        <div class="mono" style="text-align:right;">${fatPct?'<span style="font-size:1.15rem;font-weight:600;color:var(--accent);">'+fatPct.toFixed(1).replace('.',',')+' %</span> <span style="font-size:.6rem;color:var(--text-mute);">vom Gewicht</span>':''}</div>
      </div>
      ${scaleBarFor(scans, s=>s.fat, false, 'kg', 1)}
      <div class="ring-wrap">
        ${donut([{value:fatEss||1},{value:fatRes||1},{value:0.001}], last.fat!=null?last.fat.toFixed(1).replace('.',','):'—', 'kg', ['#1e40af','#FFD700','#7f1d1d'])}
        <div style="flex:1;">
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Essentiell</span><span class="mono" style="font-size:.8rem;color:#60a5fa;">${fatEss?fatEss.toFixed(1).replace('.',','):'—'} kg</span></div>
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Reserve</span><span class="mono" style="font-size:.8rem;color:#FFD700;">${fatRes?fatRes.toFixed(1).replace('.',','):'—'} kg</span></div>
          <div class="sub-row"><span class="mono" style="font-size:.7rem;color:var(--text-dim);">Überschüssig</span><span class="mono" style="font-size:.8rem;color:var(--green);">0,0 kg ✓</span></div>
        </div>
      </div>
      ${scanLineChart(scans, 'fat', '#FFD700')}
    </div>

    <!-- VISZERALES FETT -->
    <div class="frame" style="--accent:var(--red);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('visceral')}
      <div class="eyebrow mono" style="color:var(--red);margin-bottom:.5rem;padding-right:1.6rem;">VISZERALES FETT</div>
      ${scaleBarFor(scans, s=>s.visceral, false, 'kg', 1)}
      <div style="display:flex;gap:1rem;align-items:center;">
        ${visceralProfile(last.visceral || 0)}
        <div style="flex:1;">
          <div class="mono" style="font-size:.65rem;color:var(--text-mute);letter-spacing:.1em;">VISZERALES FETT</div>
          <div class="single-value" style="margin:.2rem 0;">
            <div class="num" style="color:${(last.visceral||0) < 1 ? '#22c55e' : (last.visceral||0) < 2 ? '#a3e635' : (last.visceral||0) < 3 ? '#facc15' : (last.visceral||0) < 4 ? '#f97316' : '#ef4444'};font-size:2rem;">${last.visceral != null ? last.visceral.toFixed(1).replace('.',',') : '—'}</div>
            <div class="unit">kg</div>
          </div>
          <div class="mono" style="font-size:.6rem;color:var(--text-faint);margin-top:.3rem;">Unter 2,0 kg = gut</div>
        </div>
      </div>
      ${scanLineChart(scans, 'visceral', 'var(--red)')}
    </div>

    <!-- ZELLFITNESS -->
    <div class="frame" style="--accent:var(--lime);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('cellFit')}
      <div class="eyebrow mono" style="color:var(--lime);margin-bottom:.5rem;padding-right:1.6rem;">ZELLFITNESS (PHASENWINKEL)</div>
      ${scaleBarFor(scans, s=>s.cellFit, true, '°', 1)}
      <div class="single-value"><div class="num" style="color:var(--lime);">${last.cellFit != null ? last.cellFit.toFixed(1).replace('.',',') : '—'}</div><div class="unit">Phasenwinkel</div></div>
      ${scanLineChart(scans, 'cellFit', 'var(--lime)')}
    </div>

    <!-- SAUERSTOFF -->
    <div class="frame" style="--accent:var(--sky);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('spo2')}
      <div class="eyebrow mono" style="color:var(--sky);margin-bottom:.5rem;padding-right:1.6rem;">SAUERSTOFFSÄTTIGUNG</div>
      ${scaleBarFor(scans, s=>s.oxygen, true, '%', 0)}
      <div style="display:flex;align-items:center;gap:1rem;">
        ${o2Icon('#38bdf8')}
        <div class="single-value"><div class="num" style="color:var(--sky);">${last.oxygen != null ? last.oxygen : '—'}</div><div class="unit">%</div></div>
      </div>
      ${scanLineChart(scans, 'oxygen', 'var(--sky)')}
    </div>

    <!-- RUHE-HF -->
    <div class="frame" style="--accent:var(--text-dim);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('hr')}
      <div class="eyebrow mono" style="color:var(--text-dim);margin-bottom:.5rem;padding-right:1.6rem;">RUHE-HERZFREQUENZ</div>
      ${scaleBarFor(scans, s=>s.hr, false, 'bpm', 0)}
      <div style="display:flex;align-items:center;gap:1rem;">
        ${heartEkg('#a1a1aa')}
        <div class="single-value"><div class="num" style="color:var(--text);">${last.hr != null ? last.hr : '—'}</div><div class="unit">bpm</div></div>
      </div>
      ${scanLineChart(scans, 'hr', '#a1a1aa')}
    </div>

    <!-- HRV -->
    <div class="frame" style="--accent:var(--pink);padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('hrv')}
      <div class="eyebrow mono" style="color:var(--pink);margin-bottom:.5rem;padding-right:1.6rem;">HRV · TRAININGSEREITSCHAFT</div>
      ${scaleBarFor(scans, s=>s.hrv, true, 'ms', 0)}
      <div class="single-value"><div class="num" style="color:var(--pink);">${last.hrv != null ? last.hrv : '—'}</div><div class="unit">ms</div></div>
      ${scanLineChart(scans, 'hrv', 'var(--pink)')}
    </div>

    <!-- BIOAGE -->
    <div class="frame" style="--accent:${bio.color};padding:1rem;margin-bottom:.8rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      ${infoBtn('bioage')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;padding-right:1.6rem;">
        <div class="eyebrow mono" style="color:${bio.color};">BIOLOGISCHES ALTER</div>
        <div class="mono" style="font-size:.6rem;color:${bio.color};font-weight:600;">${bio.verdict}</div>
      </div>
      ${scaleBar(bio.scalePos)}
      <div style="display:flex;align-items:center;gap:1rem;">
        ${bioIconRow(bio.iconType, bio.color)}
        <div style="flex:1;">
          <div class="single-value" style="margin:.2rem 0;">
            <div class="num" style="color:${bio.color};">${bioageVal}</div>
            <div class="unit">Jahre</div>
          </div>
          <div class="mono" style="font-size:.7rem;color:var(--text-dim);">Kalendarisch: <span style="color:var(--text);">${calAge} J.</span></div>
          <div class="mono" style="font-size:.75rem;color:${bio.color};margin-top:.2rem;font-weight:600;">
            ${bio.diffPct > 0 ? '+' : ''}${bio.diffPct.toFixed(1)} % Abweichung
          </div>
        </div>
      </div>
      ${scanLineChart(scans, 'bioage', bio.color)}

function renderExerciseDetail(){
  const exName = state.exerciseName;
  if(!exName) return `<button class="back" data-back="scan">${ICON.chevronLeft} Zurück</button><div class="empty">Keine Übung ausgewählt.</div>`;
  const progress = exerciseProgress(exName);
  if(!progress.length) return `<button class="back" data-back="scan">${ICON.chevronLeft} Zurück</button><div class="empty">Für "${exName}" gibt es noch keine Einträge.</div>`;
  const latest = progress[progress.length-1]; const first = progress[0];
  const diff = latest.weight - first.weight; const sign = diff > 0 ? '+' : '';
  const dcolor = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'var(--text-mute)';
  const w = 300, h = 140, padL = 36, padR = 12, padT = 14, padB = 20;
  const weights = progress.map(p=>p.weight);
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const span = Math.max((maxW - minW) * 1.4, 10);
  const rMin = Math.max(0, Math.floor((minW - span*0.25)/5)*5);
  const rMax = Math.ceil((maxW + span*0.25)/5)*5;
  const stepX = progress.length > 1 ? (w - padL - padR) / (progress.length - 1) : 0;
  const sY = v => h - padB - ((v - rMin) / (rMax - rMin)) * (h - padT - padB);
  const path = progress.map((p, i) => `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${sY(p.weight).toFixed(1)}`).join(' ');
  const dots = progress.map((p, i) => { const isLast = i === progress.length - 1; return `<circle cx="${(padL+i*stepX).toFixed(1)}" cy="${sY(p.weight).toFixed(1)}" r="${isLast?5:3}" fill="${isLast?'var(--lime)':'var(--text-faint)'}"/>`; }).join('');
  const step = (rMax - rMin) > 30 ? 10 : 5;
  const ticks = [];
  for(let v=rMin; v<=rMax; v+=step) ticks.push(v);
  const yTickLines = ticks.map(v=>`<line x1="${padL}" y1="${sY(v).toFixed(1)}" x2="${w-padR}" y2="${sY(v).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,4"/><text x="${padL-6}" y="${(sY(v)+3).toFixed(1)}" fill="var(--text-faint)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">${v}</text>`).join('');
  return `
    <button class="back" data-back="scan">${ICON.chevronLeft} Zurück</button>
    <div class="eyebrow mono">ÜBUNGS-VERLAUF</div>
    <div class="h1 display" style="margin-bottom:1rem;">${escapeHtml(exName)}</div>
    <div class="frame" style="--accent:var(--lime);padding:1rem;margin-bottom:1rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div style="display:flex;justify-content:space-between;gap:1rem;text-align:center;margin-bottom:1rem;">
        <div style="flex:1;"><div class="eyebrow mono" style="font-size:.55rem;">AKTUELL MAX</div><div class="mono" style="font-size:1.6rem;color:var(--lime);">${latest.weight}<span style="font-size:.7rem;color:var(--text-mute);"> kg</span></div></div>
        <div style="flex:1;"><div class="eyebrow mono" style="font-size:.55rem;">GESAMT</div><div class="mono" style="font-size:1.6rem;color:${dcolor};">${sign}${diff.toFixed(1)}<span style="font-size:.7rem;color:var(--text-mute);"> kg</span></div></div>
      </div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${yTickLines}<path d="${path}" fill="none" stroke="var(--lime)" stroke-width="2.2"/>${dots}</svg>
      <div class="mono" style="font-size:.6rem;color:var(--text-faint);margin-top:.6rem;text-align:center;">${progress.length} EINTRÄGE · ERSTE: ${first.weight} kg (${fmtDate(first.date)})</div>
    </div>
    <div class="eyebrow mono" style="margin:1.5rem 0 .6rem;">ALLE SESSIONS</div>
    ${[...progress].reverse().map(p=>`<div class="frame" style="--accent:var(--text-mute);padding:.7rem 1rem;margin-bottom:.4rem;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><div style="display:flex;justify-content:space-between;align-items:center;"><div><div class="mono" style="font-size:.7rem;color:var(--text-mute);">${fmtWd(p.date)} · ${fmtDate(p.date)}</div><div class="mono" style="font-size:.9rem;color:var(--lime);">${p.weight} kg <span style="color:var(--text-faint);">× ${p.reps||'–'}</span></div></div><button class="x-btn" data-exercise-goto-session="${p.sessionId}" title="Session öffnen">${ICON.check}</button></div></div>`).join('')}
  `;
}

function chartYAxis(rangeMin, rangeMax, scaleY, padL, w, padR){
  const step = (rangeMax - rangeMin) > 40 ? 10 : 5;
  let ticks = [];
  for(let v=Math.ceil(rangeMin/step)*step; v<=rangeMax; v+=step) ticks.push(v);
  return ticks.map(v=>`<line x1="${padL}" y1="${scaleY(v).toFixed(1)}" x2="${w-padR}" y2="${scaleY(v).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,4"/><text x="${padL-6}" y="${(scaleY(v)+3).toFixed(1)}" fill="var(--text-faint)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">${v}%</text>`).join('');
}
function renderScoreChart(){
  const chronological = [...state.sessions].reverse();
  if(chronological.length < 2){ return `<div class="empty" style="margin-top:1.5rem;">Noch nicht genug Sessions für ein Diagramm (mind. 2 nötig).</div>`; }
  const DAYS = getDayTypes();
  const points = chronological.map(s=>{
    const sc = computeScore(s);
    const day = DAYS[s.dayType];
    return { y: Math.max(0, Math.min(110, sc.overall ?? 0)), accent: day ? day.accent : 'var(--lime)', id: s.id };
  });
  const ys = points.map(p=>p.y);
  const dataMin = Math.min(...ys); const dataMax = Math.max(...ys);
  const mid = (dataMin + dataMax) / 2;
  const MIN_SPAN = 30;
  let span = Math.max(MIN_SPAN, (dataMax - dataMin) * 1.4);
  let rangeMin = Math.floor((mid - span/2) / 5) * 5;
  let rangeMax = Math.ceil((mid + span/2) / 5) * 5;
  rangeMin = Math.max(0, rangeMin); rangeMax = Math.min(110, rangeMax);
  if(dataMin < rangeMin + 3){ rangeMin = Math.max(0, rangeMin - 5); }
  if(dataMax > rangeMax - 3){ rangeMax = Math.min(110, rangeMax + 5); }
  if(rangeMax < 100 && dataMax > 90) rangeMax = 100;
  const w = 320, h = 180, padL = 34, padR = 14, padT = 14, padB = 14;
  const stepX = points.length>1 ? (w - padL - padR) / (points.length-1) : 0;
  const scaleY = v => h - padB - ((v - rangeMin) / (rangeMax - rangeMin)) * (h - padT - padB);
  const pathD = points.map((p,i)=> `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${scaleY(p.y).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`<circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="6" fill="${p.accent}" stroke="#000" stroke-width="1.5" style="cursor:pointer;" data-chart-point="${p.id}"></circle><circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="16" fill="transparent" style="cursor:pointer;" data-chart-point="${p.id}"></circle>`).join('');
  const avgY = ys.reduce((a,b)=>a+b,0)/ys.length;
  return `
    <div class="eyebrow mono" style="margin:1.5rem 0 .5rem;">GESAMT-VERLAUF (${points.length} SESSIONS)</div>
    <div class="frame" style="--accent:var(--lime);padding:1rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        ${chartYAxis(rangeMin, rangeMax, scaleY, padL, w, padR)}
        <path d="${pathD}" fill="none" stroke="var(--lime)" stroke-width="2.2"/>${dots}
      </svg>
      <div class="mono" style="font-size:.6rem;color:var(--text-mute);text-align:center;margin-top:.5rem;">Gesamt-Ø ${Math.round(avgY)}%</div>
    </div>`;
}
function renderDayScoreChart(dayKey, dayLabel, dayAccent){
  const sessions = state.sessions.filter(s=>s.dayType===dayKey).slice().reverse();
  if(sessions.length < 1) return '';

    return `<div class="eyebrow mono" style="margin:1.2rem 0 .5rem;color:${dayAccent};">${dayLabel} · 1 SESSION</div><div class="frame" style="--accent:${dayAccent};padding:1rem;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><div style="text-align:center;"><div class="mono" style="font-size:1.8rem;color:${tier?tier.color:'var(--text)'};">${sc.overall!=null?sc.overall+'%':'–'}</div><div class="mono" style="font-size:.6rem;color:var(--text-faint);margin-top:.3rem;">${fmtDate(sessions[0].date)}</div></div></div>`;
  }
  const points = sessions.map(s=>{ const sc = computeScore(s); return { y: Math.max(0, Math.min(110, sc.overall ?? 0)), id: s.id }; });
  const ys = points.map(p=>p.y);
  const dataMin = Math.min(...ys); const dataMax = Math.max(...ys);
  const mid = (dataMin + dataMax) / 2;
  const MIN_SPAN = 20;
  let span = Math.max(MIN_SPAN, (dataMax - dataMin) * 1.4);
  let rangeMin = Math.floor((mid - span/2) / 5) * 5;
  let rangeMax = Math.ceil((mid + span/2) / 5) * 5;
  rangeMin = Math.max(0, rangeMin); rangeMax = Math.min(110, rangeMax);
  if(dataMin < rangeMin + 3){ rangeMin = Math.max(0, rangeMin - 5); }
  if(dataMax > rangeMax - 3){ rangeMax = Math.min(110, rangeMax + 5); }
  if(rangeMax < 100 && dataMax > 90) rangeMax = 100;
  const w = 320, h = 140, padL = 34, padR = 14, padT = 14, padB = 14;
  const stepX = points.length>1 ? (w - padL - padR) / (points.length-1) : 0;
  const scaleY = v => h - padB - ((v - rangeMin) / (rangeMax - rangeMin)) * (h - padT - padB);
  const pathD = points.map((p,i)=> `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${scaleY(p.y).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`<circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="5" fill="${dayAccent}" stroke="#000" stroke-width="1.5" style="cursor:pointer;" data-chart-point="${p.id}"></circle><circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="14" fill="transparent" style="cursor:pointer;" data-chart-point="${p.id}"></circle>`).join('');
  const avgY = ys.reduce((a,b)=>a+b,0)/ys.length;
  return `
    <div class="eyebrow mono" style="margin:1.2rem 0 .5rem;color:${dayAccent};">${dayLabel} · ${points.length} SESSIONS · Ø ${Math.round(avgY)}%</div>
    <div class="frame" style="--accent:${dayAccent};padding:1rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        ${chartYAxis(rangeMin, rangeMax, scaleY, padL, w, padR)}
        <path d="${pathD}" fill="none" stroke="${dayAccent}" stroke-width="2.2"/>${dots}
      </svg>
    </div>`;
}

function autoShort(name){
  const parts = name.trim().split(/[\/\s]+/).filter(Boolean);
  if(parts.length >= 2) return parts.slice(0,3).map(p=>p[0].toUpperCase()).join('/');
  return name.trim().slice(0,3).toUpperCase();
}
function upsertCustomDay(key, patch){
  const days = loadCustomDays();
  const idx = days.findIndex(d=>d.key===key);
  if(idx>=0){ days[idx] = {...days[idx], ...patch}; } else { days.push({key, ...patch}); }
  saveCustomDays(days);
}

function bestSessionIdsByDayType(){
  const DAYS = getDayTypes();
  const best = {};
  Object.values(DAYS).forEach(day=>{
    const sessions = state.sessions.filter(s=>s.dayType===day.key);
    if(!sessions.length) return;
    let bestId = null, bestScore = -1;
    sessions.forEach(s=>{ const sc = computeScore(s); const v = sc.overall ?? 0; if(v > bestScore){ bestScore = v; bestId = s.id; } });
    if(bestId) best[day.key] = bestId;
  });
  return best;
}

function refreshWeightSuggestFor(exName){
  if(!state.draft) return;
  const ex = state.draft.exercises.find(e=>e.name===exName);
  if(!ex) return;
  const liveSets = currentDraftSets(ex, state.draft.dayType);
  const fallbackSets = lastSessionSetsFor(state.draft.dayType, exName);
  const sug = suggestNextWeightFor(exName, liveSets || fallbackSets);
  const card = app.querySelector(`[data-ex-card="${CSS.escape(exName)}"]`);
  if(!card) return;
  const titleSpan = card.querySelector('.ex-title');
  if(!titleSpan) return;
  const oldSug = titleSpan.querySelector('.weight-suggest');
  if(oldSug) oldSug.remove();
  if(sug){
    const arrow = sug.action==='too_low' ? '↑' : sug.action==='too_high' ? '↓' : '=';
    const col = sug.action==='fit' ? 'var(--green)' : sug.action==='too_high' ? 'var(--red)' : 'var(--orange)';
    const span = document.createElement('span');
    span.className = 'weight-suggest';
    span.style.color = col;
    span.title = sug.reason;
    span.textContent = `${arrow} ${sug.weight} kg`;
    titleSpan.appendChild(span);
  }
}
