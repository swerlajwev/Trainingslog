<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trainingslog</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trainingslog" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000000; --surface:#18181b; --border:#27272a; --border-hover:#52525b;
    --text:#f4f4f5; --text-dim:#a1a1aa; --text-mute:#71717a; --text-faint:#3f3f46;
    --lime:#a3e635; --pink:#ec4899; --sky:#38bdf8;
    --orange:#fb923c; --green:#4ade80; --blue:#60a5fa; --red:#ef4444; --gold:#fbbf24; --yellow:#facc15; --purple:#a78bfa; --teal:#2dd4bf;
    --font-display:'Oswald',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
       -webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;padding:2rem 1rem 3rem;min-height:100vh;}
  .day-grid{display:flex;flex-direction:column;gap:.75rem;}
  @media (min-width:860px){
    #app{max-width:920px;padding-top:3rem;}
    .day-grid{flex-direction:row;flex-wrap:wrap;gap:1rem;}
    .day-grid .day-card{flex:1 1 calc(50% - .5rem);margin-bottom:0;}
    .pool-wrap{gap:.6rem;}
    .mood-row{gap:.5rem;}
  }
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .mono{font-family:var(--font-mono);}
  .display{font-family:var(--font-display);}
  .eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--text-mute);}
  .h1{font-size:1.6rem;font-weight:600;letter-spacing:.02em;margin:.2rem 0 1.2rem;}
  .frame{position:relative;background:rgba(24,24,27,.6);border:1px solid var(--border);padding:1rem;width:100%;text-align:left;color:inherit;}
  .frame .corner{position:absolute;width:12px;height:12px;}
  .frame .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);}
  .frame .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
  .day-card{margin-bottom:.75rem;background:#000;border:none;padding:0;}
  .day-card .frame{padding:1rem;}
  .day-row{display:flex;align-items:center;justify-content:space-between;}
  .day-badge{display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.02em;}
  .btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.8rem;letter-spacing:.2em;}
  .btn-outline:hover{border-color:var(--border-hover);color:var(--text);}
  .chip-row{display:flex;gap:.5rem;margin-bottom:1.5rem;}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem;border:1px solid var(--border);background:transparent;color:var(--text-mute);font-size:.72rem;letter-spacing:.2em;}
  .chip.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .set-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
  .set-idx{width:1.2rem;text-align:center;font-size:.72rem;color:var(--accent);}
  .set-input{width:100%;background:#09090b;border:1px solid var(--border);padding:.4rem .5rem;color:var(--text);font-size:.9rem;}
  .set-input:focus{outline:none;border-color:var(--border-hover);}
  .x-btn{background:none;border:none;color:var(--text-faint);padding:.2rem;}
  .add-set{margin-top:.5rem;display:flex;align-items:center;gap:.3rem;background:none;border:none;font-size:.72rem;letter-spacing:.2em;color:var(--accent);padding:0;}
  .pool-wrap{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;}
  .pool-btn{display:flex;align-items:center;gap:.3rem;padding:.55rem .8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.85rem;}
  .pool-btn:hover{border-color:var(--border-hover);color:var(--text);}
  .pool-item{display:flex;align-items:center;gap:.15rem;}
  .edit-toggle{display:flex;align-items:center;gap:.35rem;background:none;border:none;color:var(--text-mute);font-size:.68rem;letter-spacing:.15em;padding:.3rem .1rem;}
  .edit-toggle:hover{color:var(--text);}
  .pool-edit-row{display:flex;align-items:center;gap:.4rem;width:100%;margin-bottom:.5rem;}
  .back{display:flex;align-items:center;gap:.25rem;background:none;border:none;color:var(--text-mute);font-size:.9rem;margin-bottom:1.2rem;padding:0;}
  .save-btn{width:100%;padding:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;letter-spacing:.15em;color:#000;border:none;background:var(--accent);font-family:var(--font-display);font-size:1rem;}
  .save-btn:disabled{background:var(--border);color:var(--text-faint);}
  .ex-card{margin-bottom:.75rem;}
  .ex-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:.75rem;}
  .ex-title{font-weight:500;}
  .hist-row{width:100%;display:block;text-align:left;border:1px solid var(--border);padding:.7rem 1rem;background:none;color:inherit;margin-bottom:.5rem;}
  .hist-row:hover{border-color:var(--border-hover);}
  .hist-top{display:flex;align-items:center;justify-content:space-between;}
  .hist-left{display:flex;align-items:center;gap:.75rem;}
  .hist-date{min-width:3.5rem;flex-shrink:0;text-align:left;}
  .hist-wd{font-size:.62rem;color:var(--text-mute);}
  .hist-d{font-size:.85rem;}
  .hist-right{display:flex;align-items:center;gap:.5rem;}
  #accountFab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;}
  .fab-btn{width:2.8rem;height:2.8rem;border-radius:50%;background:#09090b;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .fab-panel{background:#09090b;border:1px solid var(--border);padding:.85rem;width:14rem;box-shadow:0 4px 16px rgba(0,0,0,.55);}
  .tag{font-size:.72rem;letter-spacing:.2em;}
  .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .6rem;font-size:.72rem;border:1px solid;margin-right:.5rem;}
  .set-pill{padding:.25rem .5rem;background:#09090b;border:1px solid var(--border);font-size:.85rem;margin:0 .4rem .4rem 0;display:inline-block;}
  .del-confirm{display:flex;gap:.5rem;}
  .del-confirm button{flex:1;padding:.8rem;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:.85rem;letter-spacing:.15em;}
  .del-confirm .yes{background:var(--pink);color:#000;border:none;font-weight:600;}
  .empty{color:var(--text-faint);font-size:.85rem;font-family:var(--font-mono);}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
  .stat-num{font-size:1.6rem;color:var(--lime);text-align:right;}
  .stat-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--text-mute);text-align:right;}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  .pulse{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.55rem .5rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);min-width:3.4rem;flex:1 1 0;}
  .mood-btn span.lbl{font-size:.55rem;letter-spacing:.04em;text-align:center;}
  .mood-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .mood-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border);outline:none;border-radius:999px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);cursor:pointer;margin-top:-6px;border:none;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--lime);border:none;cursor:pointer;}
  .energy-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;}
  .perfect-btn{border-color:var(--gold) !important;color:var(--gold) !important;}
  .swatch{width:2.1rem;height:2.1rem;border-radius:999px;border:2px solid transparent;padding:0;}
  .mood-btn span.mood-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .mood-btn span.mood-icon svg{display:block;}
  .score-wrap{display:flex;align-items:center;gap:.5rem;}
  .score-bar{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden;}
  .score-fill{height:100%;border-radius:999px;transition:width .25s ease;}
  .score-pct{font-size:.75rem;min-width:2.6rem;text-align:right;}
  .score-card{margin-bottom:1.2rem;}
  .score-legend{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-mute);margin-top:.5rem;flex-wrap:wrap;gap:.3rem;}
  textarea.set-input{width:100%;min-height:3.2rem;resize:vertical;font-family:var(--font-body);font-size:.85rem;}
</style>
</head>
<body>

<script>

  utensils:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-2-2.2-5-2.5-6.5-.8C3.8 8 4 12 6 15.5c1.6 2.8 3.3 4.5 5 4.5s2.7-1 4-1 2.3 1 4 1c1.7 0 3.4-1.7 5-4.5 2-3.5 2.2-7.5.5-9.3C22 3.5 19 3.8 17 6"/><path d="M12 7V3.5c1.4-1 3-1 4 0"/></svg>',
  edit:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',
  share:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.1 10.8 15.9 6.2M8.1 13.2l7.8 4.6"/></svg>',
};

// ---------------------------------------------------------------------
// Mood-Icons – eigene Linien-Icons (Kreis-Outline, dünne Striche) statt Emoji,
// werden über currentColor je nach Stimmung eingefärbt.
// ---------------------------------------------------------------------
const MOOD_ICONS = {
  sehr_gut:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M8 9.6q1-1.6 2-0.1M14 9.6q1-1.6 2-0.1"/><path d="M7.6 13.6h8.8"/><path d="M7.6 13.6q4.4 6 8.8 0"/></svg>',
  gut:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><circle cx="9" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.2" r="1" fill="currentColor" stroke="none"/><path d="M8.4 14q3.6 3.4 7.2 0"/></svg>',
  normal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><circle cx="9" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.2" r="1" fill="currentColor" stroke="none"/><path d="M8.6 15h6.8"/></svg>',
  nachdenklich:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M13.1 8.7q1.6-1.15 2.75-.15"/><path d="M8 9.3q1.1-.45 2.1 0"/><circle cx="9" cy="10.7" r="0.85" fill="currentColor" stroke="none"/><circle cx="15" cy="10.7" r="0.85" fill="currentColor" stroke="none"/><path d="M9 14.8q3-1 6 .4"/></svg>',
  muede:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.8 9.3 10.2 11.7M10.2 9.3 7.8 11.7"/><path d="M13.8 9.3 16.2 11.7M16.2 9.3 13.8 11.7"/><ellipse cx="12" cy="15.6" rx="1.8" ry="1.3"/></svg>',
  gestresst:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.6 9.4 9 10.6 7.6 11.8"/><path d="M16.4 9.4 15 10.6 16.4 11.8"/><path d="M8 15.4q1-1 2 0t2 0 2 0 2 0"/></svg>',
  traurig:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><circle cx="9" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.2" r="1" fill="currentColor" stroke="none"/><path d="M8.4 16.3q3.6-3.4 7.2 0"/></svg>',
  wuetend:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.6 8.4 10 9.7M16.4 8.4 14 9.7"/><circle cx="9" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/><path d="M8.4 16.3q3.6-3.4 7.2 0"/></svg>',
  kein_bock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.8 10.4h2.4M13.8 10.4h2.4"/><path d="M8 15q4-1 8 .4"/></svg>',
};
function moodIconSvg(key, size){
  const raw = MOOD_ICONS[key];
  if(!raw) return '';
  return size ? raw.replace(/width="\d+(\.\d+)?"/, `width="${size}"`).replace(/height="\d+(\.\d+)?"/, `height="${size}"`) : raw;
}

// ---------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------
const BUILTIN_DAY_TYPES = {
  BR: { key:'BR', label:'BRUST / RÜCKEN', short:'B/R', accent:'var(--pink)',
    pool:['Bankdrücken','High-to-Low Latziehen','Schrägbankdrücken','T-Bar Row','Untere Brust / Kabel-Flys','Breiter Latzug','Klimmzüge','Enges Rudern','Seitheben','Hintere Schultern'] },
  AS: { key:'AS', label:'ARME / SCHULTERN', short:'A/S', accent:'var(--sky)',
    pool:['Schulterpresse','Seitheben','Bizepscurls','Trizeps Push-Down','Hammercurls (einarmig)','Trizeps überkopf','Unterarme','Hintere Schultern'] },
};
const MOODS = {
  sehr_gut:   { label:'SEHR GUT', color:'var(--lime)', score:100 },
  gut:        { label:'GUT', color:'var(--green)', score:80 },
  normal:     { label:'NORMAL', color:'var(--text)', score:55 },
  nachdenklich:{ label:'NACHDENKLICH', color:'var(--yellow)', score:50 },
  muede:      { label:'MÜDE', color:'var(--teal)', score:40 },
  gestresst:  { label:'GESTRESST', color:'var(--purple)', score:28 },
  traurig:    { label:'TRAURIG', color:'var(--blue)', score:25 },
  wuetend:    { label:'WÜTEND', color:'var(--red)', score:20 },
  kein_bock:  { label:'KEIN BOCK', color:'var(--text-faint)', score:15 },
};

// ---------------------------------------------------------------------
// Score-System
// Kombiniert Stimmung/Energie (50%) und Trainingsleistung (50%, Volumen
// im Vergleich zum Ø aller bisherigen Sessions des gleichen Tagtyps).
// Der Rekord (höchstes je erreichtes Volumen) wird zusätzlich als Info
// angezeigt. Bei PERFEKT (Energie 110%) darf der Gesamt-Score bis 110% gehen.
// ---------------------------------------------------------------------
const SCORE_TIERS = [
  { min:0,  label:'SCHWACH', color:'var(--red)' },
  { min:20, label:'MAU',     color:'var(--orange)' },
  { min:40, label:'OKAY',    color:'var(--yellow)' },
  { min:60, label:'GUT',     color:'var(--green)' },
  { min:80, label:'TOP',     color:'var(--lime)' },
];
function getTier(score){
  let t = SCORE_TIERS[0];
  for(const s of SCORE_TIERS){ if(score>=s.min) t=s; }
  return t;
}
function sessionVolume(s){
  let vol = 0;
  (s.exercises||[]).forEach(ex=>{
    (ex.sets||[]).forEach(st=>{
      const w = parseFloat(st.weight), r = effectiveReps(st);
      if(!isNaN(w) && !isNaN(r)) vol += w*r;
    });
  });
  return vol;
}
function dayTypeVolumes(dayType, excludeId){
  return state.sessions.filter(s=>s.dayType===dayType && s.id!==excludeId).map(sessionVolume).filter(v=>v>0);
}
function computeScore(session){
  const vols = dayTypeVolumes(session.dayType, session.id);
  const avgVol = vols.length ? vols.reduce((a,b)=>a+b,0)/vols.length : null;
  const recordVol = vols.length ? Math.max(...vols) : null;
  const vol = sessionVolume(session);

  const moodPart = (session.mood && MOODS[session.mood]) ? MOODS[session.mood].score : null;
  const energyPart = typeof session.energyLevel==='number' ? session.energyLevel : null;
  let subjective = null;
  if(moodPart!=null && energyPart!=null) subjective = (moodPart+energyPart)/2;
  else if(moodPart!=null) subjective = moodPart;
  else if(energyPart!=null) subjective = energyPart;

  let training = null;
  if(avgVol){ training = Math.min(140, (vol/avgVol)*100); }
  else if(vol>0){ training = 100; } // erste Session dieses Tagtyps -> neutral

  let overall = null;
  if(subjective!=null && training!=null) overall = subjective*0.3 + training*0.7;
  else if(subjective!=null) overall = subjective;
  else if(training!=null) overall = training;
  if(overall!=null) overall = Math.max(0, Math.min(110, Math.round(overall)));

  const recordPct = (recordVol && vol) ? Math.round((vol/recordVol)*100) : null;

  return {
    overall,
    subjective: subjective!=null ? Math.round(subjective) : null,
    training: training!=null ? Math.round(training) : null,
    vol, avgVol, recordVol, recordPct,
  };
}

// ---------------------------------------------------------------------
// Streak: Wochen in Folge mit mind. 3 Sessions. Die laufende Woche
// bricht die Streak nicht, solange sie noch nicht vorbei ist.
// ---------------------------------------------------------------------
function weekMondayKey(dateLike){
  const d = new Date(dateLike);
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weekCountsFrom(sessions){
  const wc = {};
  sessions.forEach(s=>{ const k = weekMondayKey(s.date); wc[k] = (wc[k]||0)+1; });
  return wc;
}
function currentStreakWeeks(sessions){
  const wc = weekCountsFrom(sessions);
  let cursor = new Date();
  let streak = 0, first = true;
  for(let i=0;i<1000;i++){
    const key = weekMondayKey(cursor);
    const count = wc[key] || 0;
    if(first){
      if(count>=3) streak++;
    } else {
      if(count>=3) streak++; else break;
    }
    first = false;
    cursor = new Date(cursor.getTime() - 7*86400000);
  }
  return streak;
}
function longestStreakWeeks(sessions){
  if(!sessions.length) return 0;
  const wc = weekCountsFrom(sessions);
  const weekTimes = Object.keys(wc).map(k=>new Date(k).getTime());
  const minT = Math.min(...weekTimes);
  const lastCompleted = new Date(weekMondayKey(new Date()));
  lastCompleted.setDate(lastCompleted.getDate()-7);
  const maxT = lastCompleted.getTime();
  let run = 0, best = 0;
  for(let t=minT; t<=maxT; t+=7*86400000){
    const key = weekMondayKey(new Date(t));
    const count = wc[key] || 0;
    if(count>=3){ run++; best = Math.max(best,run); } else run = 0;
  }
  return Math.max(best, currentStreakWeeks(sessions));
}
function weeksSince(sessions){
  if(!sessions.length) return 0;
  const earliest = sessions.reduce((min,s)=> new Date(s.date)<new Date(min.date)?s:min, sessions[0]);
  const diffDays = (new Date() - new Date(earliest.date)) / 86400000;
  return Math.max(1, Math.round(diffDays/7));
}

const escapeHtml = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getPool(key){
  const builtin = BUILTIN_DAY_TYPES[key] ? BUILTIN_DAY_TYPES[key].pool : [];
  const custom = loadCustomPool()[key] || [];
  let names = [...builtin, ...custom];
  const ov = loadExOverrides()[key];
  if(ov){
    if(ov.renamed) names = names.map(n => ov.renamed[n] || n);
    if(ov.deleted) names = names.filter(n => !ov.deleted.includes(n));
  }
  return [...new Set(names)];
}
function isPerArm(dayKey, name){
  const ov = loadExOverrides();
  return !!(ov[dayKey] && ov[dayKey].perArm && ov[dayKey].perArm[name]);
}
function togglePerArm(dayKey, name){
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};
  if(!ov[dayKey].perArm) ov[dayKey].perArm = {};
  ov[dayKey].perArm[name] = !ov[dayKey].perArm[name];
  saveExOverrides(ov);
}
function blankSet(dayKey, name){
  return isPerArm(dayKey, name) ? { weight:'', repsLeft:'', repsRight:'' } : { weight:'', reps:'' };
}
function effectiveReps(st){
  if(st.repsLeft!==undefined || st.repsRight!==undefined){
    const l = parseFloat(st.repsLeft), r = parseFloat(st.repsRight);
    return (isNaN(l)?0:l) + (isNaN(r)?0:r);
  }
  return parseFloat(st.reps);
}
function renameExercise(dayKey, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};
  if(!ov[dayKey].renamed) ov[dayKey].renamed = {};
  ov[dayKey].renamed[oldName] = newName;
  saveExOverrides(ov);
  state.sessions.forEach(s=>{
    if(s.dayType===dayKey) s.exercises.forEach(ex=>{ if(ex.name===oldName) ex.name = newName; });
  });
  saveSessions(state.sessions);
  if(state.draft && state.draft.dayType===dayKey){
    state.draft.exercises.forEach(ex=>{ if(ex.name===oldName) ex.name = newName; });
  }
}
function deleteExercise(dayKey, name){
  const ov = loadExOverrides();
  if(!ov[dayKey]) ov[dayKey] = {};
  if(!ov[dayKey].deleted) ov[dayKey].deleted = [];
  if(!ov[dayKey].deleted.includes(name)) ov[dayKey].deleted.push(name);
  saveExOverrides(ov);
}

function getDayTypes(){
  const merged = {};
  // Bestehende Accounts (registriert vor dem Umstieg auf Cloud-Sync) sowie
  // die lokale Nutzung ganz ohne Login behalten die alten Standard-Tage.
  // Ab dem Cutoff neu registrierte Accounts starten komplett leer.
  const includeBuiltins = !authUser || (typeof authUser.createdAt === 'number' && authUser.createdAt < LEGACY_ACCOUNT_CUTOFF);
  if(includeBuiltins){
    Object.keys(BUILTIN_DAY_TYPES).forEach(k=>{ merged[k] = {...BUILTIN_DAY_TYPES[k], pool:getPool(k)}; });
  }
  loadCustomDays().forEach(d=>{ merged[d.key] = {...d, pool:getPool(d.key)}; });
  return merged;
}
function exerciseStats(dayKey){
  const stats = {};
  state.sessions.filter(s=>s.dayType===dayKey).forEach(s=>{
    s.exercises.forEach(ex=>{
      if(!stats[ex.name]) stats[ex.name] = {count:0,last:null};
      stats[ex.name].count++;
      if(!stats[ex.name].last || new Date(s.date) > new Date(stats[ex.name].last)) stats[ex.name].last = s.date;
    });
  });
  return stats;
}

function attachCloudSync(uid){
  const ref = fbDb.collection('users').doc(uid);
  ref.get().then(snap=>{
    if(!snap.exists){
      // erster Login auf diesem Account: lokale Daten hochladen, statt sie zu verlieren
      suppressNextSnapshot = true;
      ref.set({
        sessions: state.sessions,
        customDays: loadCustomDays(),
        customPool: loadCustomPool(),
        exOverrides: loadExOverrides(),
        updatedAt: Date.now(),
      });
    }
  });
  cloudUnsub = ref.onSnapshot(snap=>{
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    const data = snap.data();
    if(!data) return;
    state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    saveSessions(state.sessions, true);
    saveCustomDays(Array.isArray(data.customDays) ? data.customDays : [], true);
    saveCustomPool((data.customPool && typeof data.customPool==='object') ? data.customPool : {}, true);
    saveExOverrides((data.exOverrides && typeof data.exOverrides==='object') ? data.exOverrides : {}, true);
    render();
  });
}

    ${row('AKTUELLE STREAK', streak+' Wochen', 'var(--pink)')}

// ---------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------
function renderSession(){
  const DAYS = getDayTypes();
  const d = state.draft;
  const day = DAYS[d.dayType];
  const active = d.exercises.map(e=>e.name);
  const lastSession = state.sessions.find(s=>s.dayType===d.dayType);

  const toggles = `
    <div class="chip-row">
      <button class="chip ${d.preWorkout?'active':''}" style="--accent:var(--lime)" data-toggle="preWorkout">PRE-WORKOUT</button>
      <button class="chip ${d.energy?'active':''}" style="--accent:var(--pink)" data-toggle="energy">ENERGY DRINK</button>
    </div>`;

  const moodRow = `
    <div class="eyebrow mono" style="margin:0 0 .5rem;">STIMMUNG</div>
    <div class="mood-row">
      ${Object.entries(MOODS).map(([key,m])=>`
        <button class="mood-btn ${d.mood===key?'active':''}" style="--accent:${m.color}" data-mood="${key}">
          <span class="mood-icon" style="color:${m.color}">${moodIconSvg(key)}</span><span class="lbl">${m.label}</span>
        </button>`).join('')}
    </div>`;

  const energyVal = d.energyLevel ?? 50;
  const isPerfect = energyVal > 100;
  const energyRow = `
    <div class="eyebrow mono" style="margin:0 0 .5rem;">ENERGIE-LEVEL</div>
    <div class="energy-row">
      <input type="range" min="0" max="100" step="5" value="${Math.min(energyVal,100)}" data-energy-slider="1" style="flex:1;" />
      <span class="mono" data-energy-value="1" style="width:3.4rem;text-align:right;color:${isPerfect?'var(--gold)':'var(--lime)'};">${energyVal}%</span>
    </div>
    <button class="btn-outline mono perfect-btn" style="margin-bottom:1.5rem;${isPerfect?'background:color-mix(in srgb, var(--gold) 15%, transparent);':''}" data-perfect="1">${ICON.check} PERFEKT${isPerfect?' · 110%':''}</button>
  `;

  const foodRow = `
    <div class="eyebrow mono" style="margin:0 0 .5rem;">ERNÄHRUNG (OPTIONAL)</div>
    <textarea class="set-input mono" data-food-input="1" placeholder="Was hast du gegessen?" style="margin-bottom:1.5rem;">${d.food||''}</textarea>
  `;

  const exCards = d.exercises.map(ex => `
    <div class="ex-card frame" style="--accent:${day.accent}">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="ex-head">
        <div class="ex-title">${ex.name}</div>
        <button class="x-btn" data-remove-ex="${ex.name}">${ICON.trash}</button>
      </div>
      <div data-sets-for="${ex.name}">
        ${ex.sets.map((s,idx)=>`
          <div class="set-row">
            <span class="set-idx mono" style="color:${day.accent}">${idx+1}</span>
            <input class="set-input mono" type="number" inputmode="decimal" placeholder="kg" value="${s.weight}" data-ex="${ex.name}" data-idx="${idx}" data-field="weight" />
            <span style="color:var(--text-faint);font-size:.8rem;">×</span>
            ${isPerArm(d.dayType, ex.name) ? `
            <input class="set-input mono" type="number" inputmode="numeric" placeholder="L" title="Wiederholungen links" value="${s.repsLeft??''}" data-ex="${ex.name}" data-idx="${idx}" data-field="repsLeft" style="max-width:3.4rem;" />
            <span style="color:var(--text-faint);font-size:.75rem;">/</span>
            <input class="set-input mono" type="number" inputmode="numeric" placeholder="R" title="Wiederholungen rechts" value="${s.repsRight??''}" data-ex="${ex.name}" data-idx="${idx}" data-field="repsRight" style="max-width:3.4rem;" />
            ` : `
            <input class="set-input mono" type="number" inputmode="numeric" placeholder="wdh" value="${s.reps??''}" data-ex="${ex.name}" data-idx="${idx}" data-field="reps" />
            `}
            ${ex.sets.length>1?`<button class="x-btn" data-remove-set="${ex.name}" data-idx="${idx}">${ICON.x}</button>`:''}
          </div>`).join('')}
      </div>
      <button class="add-set mono" data-add-set="${ex.name}">${ICON.plus} SATZ</button>
    </div>
  `).join('');

  const stats = exerciseStats(d.dayType);
  const poolNames = day.pool.filter(n=>!active.includes(n)).sort((a,b)=>{
    const sa=stats[a], sb=stats[b];
    const ca=sa?sa.count:0, cb=sb?sb.count:0;
    if(cb!==ca) return cb-ca;
    const la=sa?new Date(sa.last).getTime():0, lb=sb?new Date(sb.last).getTime():0;
    return lb-la;
  });
  const pool = poolNames.map(n=>{
    const cnt = stats[n]?stats[n].count:0;
    if(state.editPoolName === n){
      return `<div class="pool-edit-row">
        <input class="set-input mono" type="text" value="${escapeHtml(state.editPoolValue ?? n)}" data-pool-edit-input="1" style="flex:1;" />
        <button class="x-btn" data-pool-edit-save="${n}" title="Speichern">${ICON.check}</button>
        <button class="x-btn" data-pool-edit-cancel="1" title="Abbrechen">${ICON.x}</button>
      </div>`;
    }
    if(state.poolEditMode){
      const pa = isPerArm(d.dayType, n);
      return `<div class="pool-item">
        <span class="pool-btn" style="cursor:default;">${n}${cnt?` <span class="mono" style="color:var(--text-faint);font-size:.7rem;">×${cnt}</span>`:''}</span>
        <button class="x-btn" data-pool-perarm="${n}" title="${pa?'Pro Arm: an (Wiederholungen einzeln links/rechts)':'Pro Arm: aus (eine gemeinsame Wiederholungszahl)'}" style="${pa?`color:${day.accent};border-color:${day.accent};`:''}">${ICON.dumbbell||'L/R'}</button>
        <button class="x-btn" data-pool-edit="${n}" title="Umbenennen">${ICON.edit}</button>
        <button class="x-btn" data-pool-delete="${n}" title="Löschen">${ICON.trash}</button>
      </div>`;
    }
    return `<button class="pool-btn" data-add-ex="${n}">${ICON.plus} ${n}${cnt?` <span class="mono" style="color:var(--text-faint);font-size:.7rem;">×${cnt}</span>`:''}</button>`;
  }).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;">
      <button class="back" data-discard="1">${ICON.chevronLeft} Abbrechen</button>
      <div class="mono" style="display:flex;align-items:center;gap:.4rem;font-size:.72rem;letter-spacing:.2em;color:${day.accent}"><span class="pulse" style="color:${day.accent}"></span>AKTIV</div>
    </div>
    <div class="eyebrow mono" style="color:${day.accent}">TAG · ${day.short}</div>
    <div class="h1 display" style="margin-bottom:.6rem;">${day.label}</div>
    <input class="set-input mono" type="date" value="${localDateInputValue(d.date)}" data-session-date="1" style="max-width:170px;margin-bottom:1.2rem;" />
    ${toggles}
    ${moodRow}
    ${energyRow}
    ${foodRow}
    ${(d.exercises.length===0 && lastSession) ? `<button class="btn-outline mono" data-copy-last="1" style="margin-bottom:1.5rem;">${ICON.history} LETZTE SESSION ÜBERNEHMEN</button>` : ''}
    <div>${exCards}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:1.5rem 0 .75rem;">
      <div class="eyebrow mono">ÜBUNGEN</div>
      <button class="edit-toggle mono" data-toggle-pool-edit="1">${ICON.edit} ${state.poolEditMode?'FERTIG':'BEARBEITEN'}</button>
    </div>
    <div class="pool-wrap">${pool}</div>
    ${state.poolEditMode ? `
    <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;">
      <input class="set-input mono" type="text" placeholder="Neue Übung…" data-custom-ex-input="1" style="flex:1;" />
      <button class="pool-btn" data-add-custom-ex="1">${ICON.plus}</button>
    </div>` : ''}
    ${scoreCardHtml(d, 'TAGES-SCORE (VORSCHAU)')}
    <button class="save-btn" data-finish="1" ${d.exercises.length===0?'disabled':''} style="background:${day.accent}">${ICON.check} SESSION SPEICHERN</button>
  `;
}

// ---------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------
function attachListeners(){
  app.querySelectorAll('[data-start]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.getAttribute('data-start');
    if(state.draft && state.draft.exercises.length>0){
      const ok = confirm('Du hast noch eine ungespeicherte Session offen. Trotzdem eine neue starten und die alte verwerfen?');
      if(!ok) return;
    }
    state.draft = { id:uid(), date:toNoonIso(new Date()), dayType:key, preWorkout:false, energy:false, mood:null, energyLevel:50, food:'', exercises:[] };
    state.view='session'; render();
  }));

  app.querySelectorAll('[data-history]').forEach(el=>el.addEventListener('click', ()=>{ state.view='history'; render(); }));
  app.querySelectorAll('[data-open-streak]').forEach(el=>el.addEventListener('click', ()=>{ state.view='streak'; render(); }));
  app.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click', ()=>{ state.view=el.getAttribute('data-back'); state.confirmDelete=false; render(); }));

  app.querySelectorAll('[data-discard]').forEach(el=>el.addEventListener('click', ()=>{ state.draft=null; state.view='home'; render(); }));

  app.querySelectorAll('[data-session-date]').forEach(el=>el.addEventListener('change', ()=>{
    const [y,m,dd] = el.value.split('-').map(Number);
    if(!y||!m||!dd) return;
    state.draft.date = new Date(y, m-1, dd, 12, 0, 0).toISOString();
  }));

  app.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const f = el.getAttribute('data-toggle'); state.draft[f] = !state.draft[f]; render();
  }));

  app.querySelectorAll('[data-mood]').forEach(el=>el.addEventListener('click', ()=>{
    state.draft.mood = el.getAttribute('data-mood'); render();
  }));

  app.querySelectorAll('[data-energy-slider]').forEach(el=>el.addEventListener('input', ()=>{
    state.draft.energyLevel = +el.value;
    const label = app.querySelector('[data-energy-value]');
    if(label) label.textContent = el.value + '%';
    persistDraft();
  }));

  app.querySelectorAll('[data-perfect]').forEach(el=>el.addEventListener('click', ()=>{
    state.draft.mood = 'sehr_gut'; state.draft.energyLevel = 110; render();
  }));

  app.querySelectorAll('[data-food-input]').forEach(el=>el.addEventListener('input', ()=>{
    state.draft.food = el.value;
    persistDraft();
  }));

  app.querySelectorAll('[data-copy-last]').forEach(el=>el.addEventListener('click', ()=>{
    const last = state.sessions.find(s=>s.dayType===state.draft.dayType);
    if(last){
      state.draft.exercises = last.exercises.map(ex=>({ name:ex.name, sets: ex.sets.map(s=>({weight:s.weight, reps:s.reps, repsLeft:s.repsLeft, repsRight:s.repsRight})) }));
    }
    render();
  }));

  app.querySelectorAll('[data-add-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-add-ex');
    state.draft.exercises.push({ name, sets:[blankSet(state.draft.dayType, name)] }); render();
  }));
  app.querySelectorAll('[data-add-custom-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const input = app.querySelector('[data-custom-ex-input]');
    const name = input ? input.value.trim() : '';
    if(!name) return;
    const dayKey = state.draft.dayType;
    const pool = loadCustomPool();
    if(!pool[dayKey]) pool[dayKey] = [];
    const builtinPool = BUILTIN_DAY_TYPES[dayKey] ? BUILTIN_DAY_TYPES[dayKey].pool : [];
    if(!builtinPool.includes(name) && !pool[dayKey].includes(name)){
      pool[dayKey].push(name); saveCustomPool(pool);
    }
    state.draft.exercises.push({ name, sets:[blankSet(dayKey, name)] });
    render();
  }));
  app.querySelectorAll('[data-toggle-pool-edit]').forEach(el=>el.addEventListener('click', ()=>{
    state.poolEditMode = !state.poolEditMode;
    state.editPoolName = null; state.editPoolValue = '';
    render();
  }));
  app.querySelectorAll('[data-pool-edit]').forEach(el=>el.addEventListener('click', ()=>{
    state.editPoolName = el.getAttribute('data-pool-edit');
    state.editPoolValue = state.editPoolName;
    render();
  }));
  app.querySelectorAll('[data-pool-edit-input]').forEach(el=>el.addEventListener('input', ()=>{
    state.editPoolValue = el.value;
  }));
  app.querySelectorAll('[data-pool-edit-save]').forEach(el=>el.addEventListener('click', ()=>{
    const oldName = el.getAttribute('data-pool-edit-save');
    renameExercise(state.draft.dayType, oldName, state.editPoolValue);
    state.editPoolName = null; state.editPoolValue = '';
    render();
  }));
  app.querySelectorAll('[data-pool-edit-cancel]').forEach(el=>el.addEventListener('click', ()=>{
    state.editPoolName = null; state.editPoolValue = '';
    render();
  }));
  app.querySelectorAll('[data-pool-perarm]').forEach(el=>el.addEventListener('click', ()=>{
    togglePerArm(state.draft.dayType, el.getAttribute('data-pool-perarm'));
    render();
  }));
  app.querySelectorAll('[data-pool-delete]').forEach(el=>el.addEventListener('click', ()=>{
    deleteExercise(state.draft.dayType, el.getAttribute('data-pool-delete'));
    render();
  }));
  app.querySelectorAll('[data-remove-ex]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-remove-ex');
    state.draft.exercises = state.draft.exercises.filter(e=>e.name!==name); render();
  }));
  app.querySelectorAll('[data-add-set]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-add-set');
    const ex = state.draft.exercises.find(e=>e.name===name);
    const lastWeight = ex.sets.length ? ex.sets[ex.sets.length-1].weight : '';
    ex.sets.push({...blankSet(state.draft.dayType, name), weight:lastWeight}); render();
  }));
  app.querySelectorAll('[data-remove-set]').forEach(el=>el.addEventListener('click', ()=>{
    const name = el.getAttribute('data-remove-set'); const idx = +el.getAttribute('data-idx');
    const ex = state.draft.exercises.find(e=>e.name===name);
    ex.sets.splice(idx,1); render();
  }));
  // inputs: update state only, no re-render (keeps focus/cursor intact)
  app.querySelectorAll('.set-input[data-ex]').forEach(el=>el.addEventListener('input', ()=>{
    const name = el.getAttribute('data-ex'); const idx = +el.getAttribute('data-idx'); const field = el.getAttribute('data-field');
    const ex = state.draft.exercises.find(e=>e.name===name);
    ex.sets[idx][field] = el.value;
    persistDraft();
  }));

  app.querySelectorAll('[data-finish]').forEach(el=>el.addEventListener('click', ()=>{
    if(state.draft && state.draft.exercises.length>0){
      state.sessions = [state.draft, ...state.sessions];
      saveSessions(state.sessions);
    }
    state.draft=null; state.view='home'; render();
  }));

  app.querySelectorAll('[data-newday-open]').forEach(el=>el.addEventListener('click', ()=>{
    state.newDay = { name:'', accent:DAY_SWATCHES[0] }; state.view='newday'; render();
  }));
  app.querySelectorAll('[data-newday-name]').forEach(el=>el.addEventListener('input', ()=>{
    state.newDay.name = el.value;
    const btn = app.querySelector('[data-newday-create]');
    if(btn) btn.disabled = !el.value.trim();
  }));
  app.querySelectorAll('[data-newday-color]').forEach(el=>el.addEventListener('click', ()=>{
    state.newDay.accent = el.getAttribute('data-newday-color'); render();
  }));
  app.querySelectorAll('[data-newday-create]').forEach(el=>el.addEventListener('click', ()=>{
    const name = state.newDay.name.trim();
    if(!name) return;
    const key = 'C' + uid();
    const short = name.slice(0,3).toUpperCase();
    const days = loadCustomDays();
    days.push({ key, label:name.toUpperCase(), short, accent:state.newDay.accent });
    saveCustomDays(days);
    state.view='home'; render();
  }));

  app.querySelectorAll('[data-share-day]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const key = el.getAttribute('data-share-day');
    const day = getDayTypes()[key];
    if(!day) return;
    shareDay(day).then(code=>{
      state.shareInfo = { code, label: day.label };
      state.view = 'share'; render();
    }).catch(err=>{
      state.shareInfo = { error: err.message || 'Teilen fehlgeschlagen.' };
      state.view = 'share'; render();
    });
  }));
  app.querySelectorAll('[data-share-copy]').forEach(el=>el.addEventListener('click', ()=>{
    const code = el.getAttribute('data-share-copy');
    if(navigator.clipboard) navigator.clipboard.writeText(code).catch(()=>{});
  }));
  app.querySelectorAll('[data-newday-import-code]').forEach(el=>el.addEventListener('input', ()=>{
    state.newDay.importCode = el.value;
    state.newDay.importError = '';
    const btn = app.querySelector('[data-newday-import]');
    if(btn) btn.disabled = !el.value.trim() || state.newDay.importBusy;
  }));
  app.querySelectorAll('[data-newday-import]').forEach(el=>el.addEventListener('click', ()=>{
    const code = state.newDay.importCode.trim();
    if(!code) return;
    state.newDay.importBusy = true; state.newDay.importError = ''; render();
    importSharedDay(code).then(()=>{
      state.newDay = { name:'', accent:DAY_SWATCHES[0], importCode:'', importError:'', importBusy:false };
      state.view='home'; render();
    }).catch(err=>{
      state.newDay.importBusy = false;
      state.newDay.importError = err.message || 'Code nicht gefunden.';
      render();
    });
  }));

  app.querySelectorAll('[data-goto-auth]').forEach(el=>el.addEventListener('click', ()=>{
    state.authForm = { email:'', password:'', error:'' }; state.view='auth'; render();
  }));
  app.querySelectorAll('[data-auth-email]').forEach(el=>el.addEventListener('input', ()=>{ state.authForm.email = el.value; }));
  app.querySelectorAll('[data-auth-password]').forEach(el=>el.addEventListener('input', ()=>{ state.authForm.password = el.value; }));
  app.querySelectorAll('[data-auth-login]').forEach(el=>el.addEventListener('click', ()=>{
    if(!fbEnabled){ state.authForm.error = 'Sync ist noch nicht eingerichtet (Firebase-Config fehlt).'; render(); return; }
    const { email, password } = state.authForm;
    fbAuth.signInWithEmailAndPassword(email, password)
      .then(()=>{ state.authForm.error=''; state.view='home'; render(); })
      .catch(err=>{ state.authForm.error = fbErrorMsg(err); render(); });
  }));
  app.querySelectorAll('[data-auth-register]').forEach(el=>el.addEventListener('click', ()=>{
    if(!fbEnabled){ state.authForm.error = 'Sync ist noch nicht eingerichtet (Firebase-Config fehlt).'; render(); return; }
    const { email, password } = state.authForm;
    fbAuth.createUserWithEmailAndPassword(email, password)
      .then(()=>{ state.authForm.error=''; state.view='home'; render(); })
      .catch(err=>{ state.authForm.error = fbErrorMsg(err); render(); });
  }));
  app.querySelectorAll('[data-auth-google]').forEach(el=>el.addEventListener('click', ()=> oauthSignIn('google')));
  app.querySelectorAll('[data-auth-github]').forEach(el=>el.addEventListener('click', ()=> oauthSignIn('github')));
  app.querySelectorAll('[data-logout]').forEach(el=>el.addEventListener('click', ()=>{
    if(fbAuth) fbAuth.signOut();
    detachCloudSync();
    authUser = null;
    state.view = 'auth';
    render();
  }));

  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{
    state.detailId = el.getAttribute('data-open'); state.confirmDelete=false; state.view='detail'; render();
  }));
  app.querySelectorAll('[data-ask-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=true; render(); }));
  app.querySelectorAll('[data-cancel-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=false; render(); }));
  app.querySelectorAll('[data-confirm-delete]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-confirm-delete');
    state.sessions = state.sessions.filter(s=>s.id!==id);
    saveSessions(state.sessions);
    state.confirmDelete=false; state.detailId=null; state.view='history'; render();
  }));
}

restoreDraft();
if(state.draft) state.view = 'session';
render();

if(fbEnabled){
  fbAuth.getRedirectResult().catch(err=>{
    state.authForm.error = fbErrorMsg(err);
  });
  fbAuth.onAuthStateChanged(user=>{
    authChecked = true;
    authUser = user ? { uid:user.uid, email:user.email, createdAt: (user.metadata && user.metadata.creationTime) ? new Date(user.metadata.creationTime).getTime() : null } : null;
    detachCloudSync();
    if(user){
      attachCloudSync(user.uid);
      if(state.view==='auth'){ state.view = state.draft ? 'session' : 'home'; }
    }
    render();
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
