<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trainingslog</title>
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trainingslog" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#000000; --surface:#18181b; --border:#27272a; --border-hover:#52525b;
    --text:#f4f4f5; --text-dim:#a1a1aa; --text-mute:#71717a; --text-faint:#3f3f46;
    --lime:#a3e635; --pink:#ec4899; --sky:#38bdf8;
    --orange:#fb923c; --green:#4ade80; --blue:#60a5fa; --red:#ef4444; --gold:#fbbf24; --yellow:#facc15; --purple:#a78bfa; --teal:#2dd4bf;
    --font-display:'Oswald',sans-serif; --font-mono:'JetBrains Mono',monospace; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;padding:2rem 1rem 7rem;min-height:100vh;}
  .day-grid{display:flex;flex-direction:column;gap:.75rem;}
  @media (min-width:860px){#app{max-width:920px;padding-top:3rem;}.day-grid{flex-direction:row;flex-wrap:wrap;gap:1rem;}.day-grid .day-card{flex:1 1 calc(50% - .5rem);margin-bottom:0;}.pool-wrap{gap:.6rem;}.mood-row{gap:.5rem;}}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .mono{font-family:var(--font-mono);}
  .display{font-family:var(--font-display);}
  .eyebrow{font-size:.72rem;letter-spacing:.25em;color:var(--text-mute);}
  .h1{font-size:1.6rem;font-weight:600;letter-spacing:.02em;margin:.2rem 0 1.2rem;}
  .frame{position:relative;background:rgba(24,24,27,.6);border:1px solid var(--border);padding:1rem;width:100%;text-align:left;color:inherit;}
  .frame .corner{position:absolute;width:12px;height:12px;}
  .frame .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);}
  .frame .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);}
  .frame .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
  .day-card{margin-bottom:.75rem;background:#000;border:none;padding:0;}
  .day-card .frame{padding:1rem;}
  .day-row{display:flex;align-items:center;justify-content:space-between;}
  .day-badge{display:flex;align-items:center;justify-content:center;min-width:2.5rem;height:2.5rem;padding:0 .4rem;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);font-family:var(--font-mono);font-size:.64rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
  .btn-outline{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.8rem;letter-spacing:.2em;}
  .btn-outline:hover{border-color:var(--border-hover);color:var(--text);}
  .btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.9rem;border:none;background:var(--lime);color:#000;font-family:var(--font-display);font-weight:600;font-size:.85rem;letter-spacing:.1em;}
  .chip-row{display:flex;gap:.5rem;margin-bottom:1.5rem;}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem;border:1px solid var(--border);background:transparent;color:var(--text-mute);font-size:.72rem;letter-spacing:.2em;}
  .chip.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .set-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
  .set-idx{width:1.2rem;text-align:center;font-size:.72rem;color:var(--accent);}
  .set-input{width:100%;background:#09090b;border:1px solid var(--border);padding:.4rem .5rem;color:var(--text);font-size:.9rem;}
  .set-input:focus{outline:none;border-color:var(--border-hover);}
  .x-btn{background:none;border:none;color:var(--text-faint);padding:.2rem;}
  .add-set{margin-top:.5rem;display:flex;align-items:center;gap:.3rem;background:none;border:none;font-size:.72rem;letter-spacing:.2em;color:var(--accent);padding:0;}
  .pool-wrap{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;}
  .pool-btn{display:flex;align-items:center;gap:.3rem;padding:.55rem .8rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.85rem;}
  .pool-btn:hover{border-color:var(--border-hover);color:var(--text);}
  .pool-item{display:flex;align-items:center;gap:.15rem;}
  .edit-toggle{display:flex;align-items:center;gap:.35rem;background:none;border:none;color:var(--text-mute);font-size:.68rem;letter-spacing:.15em;padding:.3rem .1rem;}
  .edit-toggle:hover{color:var(--text);}
  .pool-edit-row{display:flex;align-items:center;gap:.4rem;width:100%;margin-bottom:.5rem;}
  .back{display:flex;align-items:center;gap:.25rem;background:none;border:none;color:var(--text-mute);font-size:.9rem;margin-bottom:1.2rem;padding:0;}
  .save-btn{width:100%;padding:1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;letter-spacing:.15em;color:#000;border:none;background:var(--accent);font-family:var(--font-display);font-size:1rem;}
  .save-btn:disabled{background:var(--border);color:var(--text-faint);}
  .ex-card{margin-bottom:.75rem;}
  .ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
  .drag-handle{color:var(--text-faint);touch-action:none;cursor:grab;display:flex;align-items:center;flex-shrink:0;}
  .ex-card.dragging{opacity:.95;box-shadow:0 10px 28px rgba(0,0,0,.6);border-color:var(--border-hover);}
  .ex-placeholder{border:1px dashed var(--border);border-radius:2px;margin-bottom:.75rem;background:rgba(255,255,255,.02);}
  .ex-title{font-weight:500;cursor:pointer;}
  .hist-row{width:100%;display:block;text-align:left;border:1px solid var(--border);padding:.7rem 1rem;background:none;color:inherit;margin-bottom:.5rem;}
  .hist-top{display:flex;align-items:center;justify-content:space-between;}
  .hist-left{display:flex;align-items:center;gap:.75rem;}
  .hist-date{min-width:3.5rem;flex-shrink:0;text-align:left;}
  .hist-wd{font-size:.62rem;color:var(--text-mute);}
  .hist-d{font-size:.85rem;}
  .hist-right{display:flex;align-items:center;gap:.5rem;}
  .tag{font-size:.72rem;letter-spacing:.2em;}
  .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .6rem;font-size:.72rem;border:1px solid;margin-right:.5rem;}
  .set-pill{padding:.25rem .5rem;background:#09090b;border:1px solid var(--border);font-size:.85rem;margin:0 .4rem .4rem 0;display:inline-block;}
  .del-confirm{display:flex;gap:.5rem;}
  .del-confirm button{flex:1;padding:.8rem;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:.85rem;letter-spacing:.15em;}
  .del-confirm .yes{background:var(--pink);color:#000;border:none;font-weight:600;}
  .empty{color:var(--text-faint);font-size:.85rem;font-family:var(--font-mono);}
  .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
  .stat-num{font-size:1.6rem;color:var(--lime);text-align:right;}
  .stat-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--text-mute);text-align:right;}
  .streak-btn{background:transparent;border:1.5px solid var(--pink);padding:.5rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;min-width:4.5rem;}
  .streak-btn .streak-num{font-family:var(--font-mono);font-size:1.5rem;color:var(--pink);line-height:1;}
  .streak-btn .streak-label{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.15em;color:var(--pink);}
  svg{display:block;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
  .pulse{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.55rem .5rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);min-width:3.4rem;flex:1 1 0;}
  .mood-btn span.lbl{font-size:.55rem;letter-spacing:.04em;text-align:center;}
  .mood-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .mood-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border);outline:none;border-radius:999px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--lime);cursor:pointer;margin-top:-6px;border:none;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--lime);border:none;cursor:pointer;}
  .energy-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;}
  .perfect-btn{border-color:var(--gold) !important;color:var(--gold) !important;}
  .swatch{width:2.1rem;height:2.1rem;border-radius:999px;border:2px solid transparent;padding:0;}
  .mood-btn span.mood-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .score-wrap{display:flex;align-items:center;gap:.5rem;}
  .score-bar{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden;}
  .score-fill{height:100%;border-radius:999px;transition:width .25s ease;}
  .score-pct{font-size:.75rem;min-width:2.6rem;text-align:right;}
  .score-card{margin-bottom:1.2rem;}
  .score-legend{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-mute);margin-top:.5rem;flex-wrap:wrap;gap:.3rem;}
  textarea.set-input{width:100%;min-height:3.2rem;resize:vertical;font-family:var(--font-body);font-size:.85rem;}
  .vs-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;}
  .vs-label{font-size:.62rem;letter-spacing:.15em;color:var(--text-mute);min-width:4.5rem;}
  .vs-bar{flex:1;height:10px;background:var(--border);border-radius:999px;overflow:hidden;position:relative;}
  .vs-bar-fill{height:100%;border-radius:999px;}
  .vs-val{font-family:var(--font-mono);font-size:.72rem;min-width:4.5rem;text-align:right;}
  #bottomNav{position:fixed;left:0;right:0;bottom:0;background:#050505;border-top:1px solid var(--border);display:none;z-index:80;padding-bottom:env(safe-area-inset-bottom);max-width:480px;margin:0 auto;}
  #bottomNav.visible{display:flex;}
  @media (min-width:860px){#bottomNav{max-width:920px;}}
  #bottomNav .nav-btn{flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.75rem .3rem .65rem;font-family:var(--font-mono);font-size:.52rem;letter-spacing:.12em;position:relative;transition:color .15s;}
  #bottomNav .nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  #bottomNav .nav-btn.active{color:var(--lime);}
  #bottomNav .nav-btn.active svg{stroke-width:2;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--lime) 50%,transparent));}
  #bottomNav .nav-btn.active::before{content:'';position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--lime);box-shadow:0 0 8px color-mix(in srgb,var(--lime) 60%,transparent);}
  .weight-suggest{font-family:var(--font-mono);font-size:.55rem;color:var(--lime);margin-left:.3rem;opacity:.75;}
</style>
</head>
<body>
<div id="app"></div>
<div id="bottomNav"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

  zap:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>',

  user:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
};
const NAV_ICONS = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9Z"/></svg>',
  history:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="2"/></svg>',
  scan:'<svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/><circle cx="12" cy="12" r="4"/></svg>',
  profile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
};
const MOOD_ICONS = {
  sehr_gut:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M8 9.6q1-1.6 2-0.1M14 9.6q1-1.6 2-0.1"/><path d="M7.6 13.6h8.8"/><path d="M7.6 13.6q4.4 6 8.8 0"/></svg>',
  gut:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><circle cx="9" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.2" r="1" fill="currentColor" stroke="none"/><path d="M8.4 14q3.6 3.4 7.2 0"/></svg>',
  normal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><circle cx="9" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10.2" r="1" fill="currentColor" stroke="none"/><path d="M8.6 15h6.8"/></svg>',
  nachdenklich:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M13.1 8.7q1.6-1.15 2.75-.15"/><path d="M8 9.3q1.1-.45 2.1 0"/><circle cx="9" cy="10.7" r="0.85" fill="currentColor" stroke="none"/><circle cx="15" cy="10.7" r="0.85" fill="currentColor" stroke="none"/><path d="M9 14.8q3-1 6 .4"/></svg>',

  wuetend:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.6 8.4 10 9.7M16.4 8.4 14 9.7"/><circle cx="9" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/><path d="M8.4 16.3q3.6-3.4 7.2 0"/></svg>',
  kein_bock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.3"/><path d="M7.8 10.4h2.4M13.8 10.4h2.4"/><path d="M8 15q4-1 8 .4"/></svg>',
};
function moodIconSvg(key, size){
  const raw = MOOD_ICONS[key];
  if(!raw) return '';
  return size ? raw.replace(/width="\d+(\.\d+)?"/, `width="${size}"`).replace(/height="\d+(\.\d+)?"/, `height="${size}"`) : raw;
}

const BUILTIN_DAY_TYPES = {
  BR:{ key:'BR', label:'BRUST / RÜCKEN', short:'B/R', accent:'var(--pink)',

function humanFactor(profile){
  if(!profile) return null;
  const w = parseFloat(profile.weight); const a = parseFloat(profile.age);
  if(!w || !a || !profile.gender || !profile.experience) return null;
  const gf = profile.gender === 'w' ? 0.65 : 1.0;
  const wf = w / 80;
  let af;
  if(a > 30) af = Math.max(0.5, 1 - (a-30)*0.008);
  else if(a < 30) af = Math.min(1.15, 1 + (30-a)*0.005);
  else af = 1.0;
  const ef = profile.experience === 'anfaenger' ? 0.6 : profile.experience === 'erfahren' ? 1.4 : 1.0;
  return gf * wf * af * ef;
}
function humanEstimate(exName, profile){
  const f = humanFactor(profile);
  if(f == null) return null;
  const base = HUMAN_REFERENCE[exName] || (HUMAN_REFERENCE.__overall__ * 0.25);
  return base * f;
}

function computeScore(session){
  const vols = dayTypeVolumes(session.dayType, session.id);
  const avgVol = vols.length ? vols.reduce((a,b)=>a+b,0)/vols.length : null;
  const recordVol = vols.length ? Math.max(...vols) : null;
  const vol = sessionVolume(session);

  if(overall!=null) overall = Math.max(0, Math.min(110, Math.round(overall)));
  const profile = loadProfile();

function weekMondayKey(dateLike){ const d = new Date(dateLike); const day = d.getDay(); const diff = (day===0?-6:1-day); d.setHours(0,0,0,0); d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10); }
function weekDistinctDaysFrom(sessions){
  const wd = {};
  sessions.forEach(s=>{
    const k = weekMondayKey(s.date);
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const dayKey = d.toISOString().slice(0,10);
    if(!wd[k]) wd[k] = new Set();
    wd[k].add(dayKey);
  });
  const counts = {};
  Object.keys(wd).forEach(k=>{ counts[k] = wd[k].size; });
  return counts;
}
function currentStreakWeeks(sessions){
  const wc = weekDistinctDaysFrom(sessions);
  let cursor = new Date(); let streak = 0, first = true;
  for(let i=0;i<1000;i++){
    const key = weekMondayKey(cursor);
    const count = wc[key] || 0;
    if(first){ if(count>=3) streak++; } else { if(count>=3) streak++; else break; }
    first = false;
    cursor = new Date(cursor.getTime() - 7*86400000);
  }
  return streak;
}
function longestStreakWeeks(sessions){
  if(!sessions.length) return 0;
  const wc = weekDistinctDaysFrom(sessions);
  const weekTimes = Object.keys(wc).map(k=>new Date(k).getTime());
  const minT = Math.min(...weekTimes);
  const lastCompleted = new Date(weekMondayKey(new Date())); lastCompleted.setDate(lastCompleted.getDate()-7);
  const maxT = lastCompleted.getTime();
  let run = 0, best = 0;
  for(let t=minT; t<=maxT; t+=7*86400000){
    const key = weekMondayKey(new Date(t)); const count = wc[key] || 0;
    if(count>=3){ run++; best = Math.max(best,run); } else run = 0;
  }
  return Math.max(best, currentStreakWeeks(sessions));
}
function weeksSince(sessions){
  if(!sessions.length) return 0;
  const earliest = sessions.reduce((min,s)=> new Date(s.date)<new Date(min.date)?s:min, sessions[0]);
  const diffDays = (new Date() - new Date(earliest.date)) / 86400000;
  return Math.max(1, Math.round(diffDays/7));
}

function suggestNextWeight(lastSets){

  const weights = lastSets.map(s=>s.weight);
  const avgWeight = Math.round(weights.reduce((a,b)=>a+b,0) / weights.length * 2) / 2;
  const increment = avgWeight < 15 ? 1 : avgWeight < 30 ? 1.25 : 2.5;
  const reps = lastSets.map(s=>s.reps);
  const minReps = Math.min(...reps);
  const maxReps = Math.max(...reps);
  if(minReps >= 12){
    return { weight: avgWeight + increment, action: 'too_low', reason: 'Alle Sätze ≥ 12 Wdh – mehr Gewicht' };
  }
  if(minReps < 8){
    return { weight: Math.max(0, avgWeight - increment), action: 'too_high', reason: 'Mind. 1 Satz unter 8 Wdh – Gewicht runter' };
  }
  return { weight: avgWeight, action: 'fit', reason: 'Alle Sätze im Zielbereich (' + minReps + '–' + maxReps + ' Wdh) – passt' };
}

async function extractPdf(file){
  if(!window.pdfjsLib) throw new Error('PDF-Bibliothek nicht geladen');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    text += tc.items.map(it=>it.str).join(' ') + '\n';
  }
  return parseVicoachText(text);
}
function parseVicoachText(raw){
  const t = raw.replace(/\s+/g,' ');
  const result = {date: new Date().toISOString().slice(0,10)};
  const numOf = (str) => { if(!str) return null; const n = parseFloat(String(str).replace(',','.')); return isNaN(n) ? null : n; };
  let m = t.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(m){ result.date = `${m[3]}-${m[2]}-${m[1]}`; }
  else { m = t.match(/(\d{4})\/(\d{2})\/(\d{2})/); if(m) result.date = `${m[1]}-${m[2]}-${m[3]}`; }
  const findNear = (keyword) => {
    const idx = t.toLowerCase().indexOf(keyword.toLowerCase());
    if(idx < 0) return null;
    const sub = t.substring(idx, idx + 250);
    const nm = sub.match(/([0-9]+[.,][0-9]+|[0-9]+)/);
    return nm ? numOf(nm[1]) : null;
  };
  const g = findNear('Gewicht'); if(g!=null) result.weight = g;
  const mm = findNear('Muskelmasse'); if(mm!=null) result.muscle = mm;
  const f = findNear('Fettmasse'); if(f!=null) result.fat = f;
  const vz = findNear('Viszerales Fett'); if(vz!=null) result.visceral = vz;
  const cf = findNear('Zellfitnesswert'); if(cf!=null) result.cellFit = cf;
  const hrv = findNear('HRV-Trainingsbereitschaft'); if(hrv!=null) result.hrv = hrv;
  const oxy = findNear('SpO2'); if(oxy!=null) result.oxygen = oxy;
  const hr = findNear('Herzfrequenz'); if(hr!=null) result.hr = hr;
  const ba = findNear('Bioage'); if(ba!=null) result.bioage = ba;
  return result;
}

    if(!snap.exists){
      suppressNextSnapshot = true;
      ref.set({ sessions: state.sessions, customDays: loadCustomDays(), customPool: loadCustomPool(), exOverrides: loadExOverrides(), profile: loadProfile(), bodyScans: loadBodyScans(), updatedAt: Date.now() });
    }
  });
  cloudUnsub = ref.onSnapshot(snap=>{
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    const data = snap.data(); if(!data) return;
    state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    saveSessions(state.sessions, true);
    saveCustomDays(Array.isArray(data.customDays) ? data.customDays : [], true);
    saveCustomPool((data.customPool && typeof data.customPool==='object') ? data.customPool : {}, true);
    saveExOverrides((data.exOverrides && typeof data.exOverrides==='object') ? data.exOverrides : {}, true);
    if(data.profile && typeof data.profile==='object'){ saveProfile(data.profile, true); state.profile = data.profile; }
    state.bodyScans = Array.isArray(data.bodyScans) ? data.bodyScans : [];
    saveBodyScans(state.bodyScans, true);
    render();
  });
}

function scanMiniChart(scans, key, color){
  if(scans.length < 2) return '';
  const pts = scans.map(s=>parseFloat(s[key])).filter(v=>!isNaN(v));
  if(pts.length < 2) return '';
  const min = Math.min(...pts), max = Math.max(...pts);
  const span = Math.max((max-min)*1.6, 0.5);
  const rMin = min - span*0.25, rMax = max + span*0.25;
  const w = 280, h = 60, padL = 6, padR = 6, padT = 6, padB = 6;
  const stepX = (w - padL - padR) / (pts.length - 1);
  const sY = v => h - padB - ((v - rMin) / (rMax - rMin)) * (h - padT - padB);
  const path = pts.map((v, i) => `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${sY(v).toFixed(1)}`).join(' ');
  const dots = pts.map((v, i) => { const isLast = i === pts.length - 1; return `<circle cx="${(padL+i*stepX).toFixed(1)}" cy="${sY(v).toFixed(1)}" r="${isLast?4:2.2}" fill="${isLast?color:'var(--text-faint)'}"/>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.8"/>${dots}</svg>`;
}
function scanValueCard(scans, label, key, unit, color, hint, invertGood){
  if(!scans.length) return '';
  const latest = scans[scans.length-1];
  const value = latest[key];
  if(value===undefined || value==='' || value===null) return '';
  const num = parseFloat(value);
  const first = parseFloat(scans[0][key]);
  let delta = '';
  if(!isNaN(num) && !isNaN(first) && Math.abs(num-first) > 0.05){
    const diff = num - first;
    const sign = diff > 0 ? '+' : '';
    const dcolor = invertGood ? (diff < 0 ? 'var(--green)' : 'var(--red)') : (diff > 0 ? 'var(--green)' : 'var(--red)');
    delta = `<span class="mono" style="color:${dcolor};font-size:.6rem;margin-left:.4rem;">${sign}${diff.toFixed(1)}</span>`;
  }
  const chart = scanMiniChart(scans, key, color);
  return `
    <div class="frame" style="--accent:${color};padding:.8rem 1rem;margin-bottom:.6rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;">
        <div style="flex:1;min-width:0;">
          <div class="eyebrow mono" style="font-size:.6rem;margin-bottom:.3rem;">${label}</div>
          <div class="mono" style="font-size:1.3rem;color:${color};line-height:1;">
            ${value}<span style="font-size:.7rem;color:var(--text-mute);margin-left:.3rem;">${unit}</span>${delta}
          </div>
          ${hint?`<div class="mono" style="font-size:.55rem;color:var(--text-faint);margin-top:.35rem;">${hint}</div>`:''}
        </div>
        ${chart?`<div style="flex:1.4;min-width:0;">${chart}</div>`:''}
      </div>
    </div>`;
}

function renderScoreChart(){
  const chronological = [...state.sessions].reverse();
  if(chronological.length < 2){ return `<div class="empty" style="margin-top:1.5rem;">Noch nicht genug Sessions für ein Diagramm (mind. 2 nötig).</div>`; }
  const DAYS = getDayTypes();
  const points = chronological.map(s=>{
    const sc = computeScore(s);
    const day = DAYS[s.dayType];
    return { y: Math.max(0, Math.min(110, sc.overall ?? 0)), accent: day ? day.accent : 'var(--lime)', id: s.id, date: s.date, dayLabel: day ? day.short : '?' };
  });
  const ys = points.map(p=>p.y);
  const dataMin = Math.min(...ys); const dataMax = Math.max(...ys);
  const mid = (dataMin + dataMax) / 2;
  const MIN_SPAN = 30;
  let span = Math.max(MIN_SPAN, (dataMax - dataMin) * 1.4);
  let rangeMin = Math.floor((mid - span/2) / 5) * 5;
  let rangeMax = Math.ceil((mid + span/2) / 5) * 5;
  rangeMin = Math.max(0, rangeMin); rangeMax = Math.min(110, rangeMax);
  if(dataMin < rangeMin + 3){ rangeMin = Math.max(0, rangeMin - 5); }
  if(dataMax > rangeMax - 3){ rangeMax = Math.min(110, rangeMax + 5); }
  const w = 320, h = 180, padL = 34, padR = 14, padT = 14, padB = 14;
  const stepX = points.length>1 ? (w - padL - padR) / (points.length-1) : 0;
  const scaleY = v => h - padB - ((v - rangeMin) / (rangeMax - rangeMin)) * (h - padT - padB);
  const pathD = points.map((p,i)=> `${i===0?'M':'L'} ${(padL+i*stepX).toFixed(1)} ${scaleY(p.y).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`
    <circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="6" fill="${p.accent}" stroke="#000" stroke-width="1.5" style="cursor:pointer;" data-chart-point="${p.id}"></circle>
    <circle cx="${(padL+i*stepX).toFixed(1)}" cy="${scaleY(p.y).toFixed(1)}" r="16" fill="transparent" style="cursor:pointer;" data-chart-point="${p.id}"></circle>`).join('');
  const avgY = ys.reduce((a,b)=>a+b,0)/ys.length;
  const avgLineY = scaleY(avgY).toFixed(1);
  const dayAvgLines = Object.values(DAYS).map(day=>{
    const dayPts = points.filter((p,i)=> chronological[i].dayType === day.key);
    if(dayPts.length < 2) return '';
    const dayAvg = dayPts.reduce((a,p)=>a+p.y,0)/dayPts.length;
    const yLine = scaleY(dayAvg).toFixed(1);
    return `<line x1="${padL}" y1="${yLine}" x2="${w-padR}" y2="${yLine}" stroke="${day.accent}" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>`;
  }).join('');
  const tickMid = Math.round((rangeMin + rangeMax) / 2 / 5) * 5;
  const yTickLines = [rangeMin, tickMid, rangeMax].map(v=>`
    <line x1="${padL}" y1="${scaleY(v).toFixed(1)}" x2="${w-padR}" y2="${scaleY(v).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,4"/>
    <text x="${padL-6}" y="${(scaleY(v)+3).toFixed(1)}" fill="var(--text-faint)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">${v}%</text>`).join('');
  return `
    <div class="eyebrow mono" style="margin:1.5rem 0 .5rem;">SCORE-VERLAUF (${points.length} SESSIONS)</div>
    <div class="frame" style="--accent:var(--lime);padding:1rem;">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        ${yTickLines}
        ${dayAvgLines}
        <line x1="${padL}" y1="${avgLineY}" x2="${w-padR}" y2="${avgLineY}" stroke="var(--text-mute)" stroke-width="1.2" stroke-dasharray="6,3"/>
        <path d="${pathD}" fill="none" stroke="var(--lime)" stroke-width="2.2"/>
        ${dots}
      </svg>
      <div class="mono" style="font-size:.55rem;color:var(--text-faint);margin-top:.5rem;text-align:center;">
        gestrichelt grau: Gesamt-Ø (${Math.round(avgY)}%) · farbige Linien: Ø pro Tag-Typ
      </div>
    </div>`;
}

function initExerciseDrag(){
  const container = app.querySelector('#ex-list-container');
  if(container){
    container.querySelectorAll('[data-drag-handle]').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        const card = handle.closest('[data-ex-card]');
        if(!card) return;
        e.preventDefault();
        const rect = card.getBoundingClientRect();
        const startY = e.clientY, startTop = rect.top, startLeft = rect.left, width = rect.width, height = rect.height;
        const placeholder = document.createElement('div');
        placeholder.className = 'ex-placeholder';
        placeholder.style.height = height + 'px';
        card.parentNode.insertBefore(placeholder, card.nextSibling);
        card.classList.add('dragging');
        card.style.position = 'fixed'; card.style.top = startTop + 'px'; card.style.left = startLeft + 'px';
        card.style.width = width + 'px'; card.style.zIndex = '200'; card.style.pointerEvents = 'none';
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        const onMove = (ev)=>{
          const dy = ev.clientY - startY;
          card.style.top = (startTop + dy) + 'px';
          const dragMid = startTop + dy + height/2;
          let prev = placeholder.previousElementSibling;
          while(prev && prev.matches('[data-ex-card]') && prev !== card){
            const pr = prev.getBoundingClientRect();
            if(dragMid < pr.top + pr.height/2){ container.insertBefore(placeholder, prev); prev = placeholder.previousElementSibling; } else break;
          }
          let next = placeholder.nextElementSibling;
          while(next && next.matches('[data-ex-card]') && next !== card){
            const nr = next.getBoundingClientRect();
            if(dragMid > nr.top + nr.height/2){ container.insertBefore(next, placeholder); next = placeholder.nextElementSibling; } else break;
          }
        };
        const onUp = ()=>{
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          container.insertBefore(card, placeholder);
          placeholder.remove();
          card.classList.remove('dragging');
          card.style.position = ''; card.style.top = ''; card.style.left = ''; card.style.width = ''; card.style.zIndex = ''; card.style.pointerEvents = '';
          const newOrder = Array.from(container.querySelectorAll('[data-ex-card]')).map(c=>c.getAttribute('data-ex-card'));
          const byName = {};
          state.draft.exercises.forEach(ex=>{ byName[ex.name] = ex; });
          state.draft.exercises = newOrder.map(n=>byName[n]).filter(Boolean);
          persistDraft(); updateScorePreview();
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    });
  }
  const cEdit = app.querySelector('#ex-list-edit-container');
  if(cEdit){
    cEdit.querySelectorAll('[data-drag-handle-edit]').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        const card = handle.closest('[data-ex-card-edit]');
        if(!card) return;
        e.preventDefault();
        const rect = card.getBoundingClientRect();
        const startY = e.clientY, startTop = rect.top, startLeft = rect.left, width = rect.width, height = rect.height;
        const placeholder = document.createElement('div');
        placeholder.className = 'ex-placeholder';
        placeholder.style.height = height + 'px';
        card.parentNode.insertBefore(placeholder, card.nextSibling);
        card.classList.add('dragging');
        card.style.position = 'fixed'; card.style.top = startTop + 'px'; card.style.left = startLeft + 'px';
        card.style.width = width + 'px'; card.style.zIndex = '200'; card.style.pointerEvents = 'none';
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        const onMove = (ev)=>{
          const dy = ev.clientY - startY;
          card.style.top = (startTop + dy) + 'px';
          const dragMid = startTop + dy + height/2;
          let prev = placeholder.previousElementSibling;
          while(prev && prev.matches('[data-ex-card-edit]') && prev !== card){
            const pr = prev.getBoundingClientRect();
            if(dragMid < pr.top + pr.height/2){ cEdit.insertBefore(placeholder, prev); prev = placeholder.previousElementSibling; } else break;
          }
          let next = placeholder.nextElementSibling;
          while(next && next.matches('[data-ex-card-edit]') && next !== card){
            const nr = next.getBoundingClientRect();
            if(dragMid > nr.top + nr.height/2){ cEdit.insertBefore(next, placeholder); next = placeholder.nextElementSibling; } else break;
          }
        };
        const onUp = ()=>{
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          cEdit.insertBefore(card, placeholder);
          placeholder.remove();
          card.classList.remove('dragging');
          card.style.position = ''; card.style.top = ''; card.style.left = ''; card.style.width = ''; card.style.zIndex = ''; card.style.pointerEvents = '';
          const newOrder = Array.from(cEdit.querySelectorAll('[data-ex-card-edit]')).map(c=>+c.getAttribute('data-ex-card-edit'));
          const old = state.editSessionDraft.exercises;
          state.editSessionDraft.exercises = newOrder.map(i=>old[i]).filter(Boolean);
          render();
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    });
  }

  }));
  app.querySelectorAll('[data-edit-save]').forEach(el=>el.addEventListener('click', ()=>{
    const idx = state.sessions.findIndex(x=>x.id===state.editSessionDraft.id);
    if(idx>=0){ state.sessions[idx] = state.editSessionDraft; saveSessions(state.sessions); }
    state.editSessionDraft = null; render();
  }));
  app.querySelectorAll('[data-cancel-delete]').forEach(el=>el.addEventListener('click', ()=>{ state.confirmDelete=false; render(); }));
  app.querySelectorAll('[data-confirm-delete]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-confirm-delete');
    state.sessions = state.sessions.filter(s=>s.id!==id);
    saveSessions(state.sessions);
    state.confirmDelete=false; state.detailId=null; state.view='history'; render();
  }));
}
restoreDraft();
if(state.draft) state.view = 'session';
render();
if(fbEnabled){
  fbAuth.getRedirectResult().catch(err=>{ state.authForm.error = fbErrorMsg(err); });
  fbAuth.onAuthStateChanged(user=>{
    authChecked = true;
    authUser = user ? {uid:user.uid, email:user.email} : null;
    detachCloudSync();
    if(user) attachCloudSync(user.uid);
    seedInitialScansForOwner();
    render();
  });
} else {
  authChecked = true;
  seedInitialScansForOwner();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
